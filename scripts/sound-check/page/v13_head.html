<style>
/* One reading column; methods-theme.css supplies the shared light/dark display. */
:root {
  color-scheme: dark;
  --ink: #070b10;          /* page ground: night water */
  --panel: #0e151d;        /* figure surface */
  --rule: #1f2b37;
  --fg: #e7edf2;
  --fg-2: #a3b1bd;
  --fg-3: #6c7b88;
  --swell: #f08a4b;        /* energy / good-day accent (warm end of the period ramp) */
  --swell-soft: #9a5a35;
  --cool: #4fb6c9;         /* short period, cool end */
  --offshore: #5fd08a;     /* offshore wind */
  --blown: #3a4652;        /* blown out / out of window */
  --display: "Newsreader", Georgia, "Times New Roman", serif;
  --body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
[hidden] { display: none !important; }
body { background: var(--ink); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.55; }
.wrap { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 64px; display: grid; gap: 44px; }
h1, h2, h3 { font-family: var(--display); font-weight: 600; text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: clamp(2.2rem, 7vw, 3.4rem); line-height: 1.02; }
h2 { font-size: 1.6rem; line-height: 1.15; }
h3 { font-size: 1.15rem; line-height: 1.2; }
p { margin: 0; max-width: 65ch; color: var(--fg-2); }
p strong { color: var(--fg); font-weight: 600; }
.eyebrow { font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--fg-3); }
header { display: grid; gap: 12px; }
header .lede { font-size: 1.08rem; }
section { display: grid; gap: 14px; min-width: 0; }
figure { margin: 0; background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
figcaption { font-size: 0.85rem; color: var(--fg-3); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }


.controls, .toggles { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; }
button { font: 500 0.85rem var(--body); background: var(--rule); color: var(--fg); border: 1px solid #2c3b49; border-radius: 4px; padding: 6px 12px; cursor: pointer; }
button:hover { background: #2a3846; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--swell); outline-offset: 2px; }
button:disabled { opacity: .45; cursor: not-allowed; }
select { font: 0.85rem var(--body); background: var(--rule); color: var(--fg); border: 1px solid #2c3b49; border-radius: 4px; padding: 5px 8px; }
.seg { display: inline-flex; border: 1px solid #2c3b49; border-radius: 4px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; background: transparent; color: var(--fg-2); padding: 6px 10px; font-size: 0.8rem; }
.seg button + button { border-left: 1px solid #2c3b49; }
.seg button[aria-pressed="true"] { background: #23384a; color: var(--fg); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 0.8rem; color: var(--fg-2); align-items: center; }
.key { display: inline-flex; gap: 6px; align-items: center; }
.sw { width: 12px; height: 12px; border-radius: 2px; display: inline-block; }
.ramp { width: 70px; height: 8px; border-radius: 2px; background: linear-gradient(90deg, var(--cool), #d8d17a, var(--swell)); display: inline-block; }
.rl { display: inline-flex; gap: 8px; align-items: center; font-size: .85rem; color: var(--fg-2); }
.rl input { accent-color: var(--swell); width: 140px; }
.trs { margin: 14px 0 8px; display: grid; gap: 10px; }
.trs-h { font-family: var(--mono); font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: var(--fg-3); }
.tr { display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px; padding: 10px 12px; border: 1px solid var(--rule); border-radius: 8px; background: var(--panel); }
.tr-l { color: var(--fg-2); font-size: .92rem; } .tr-l b { color: var(--fg); }
.tr-r { font-size: .92rem; color: var(--fg-2); } .tr-r b { color: var(--swell); }
.tr-bar { position: relative; height: 10px; border-radius: 5px; background: rgba(255,255,255,.04); }
.tr-bar i, .tr-k i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; background: var(--fg-3); opacity: .45; }
.tr-bar i.r, .tr-k i.r { background: var(--swell); opacity: 1; height: 6px; top: 2px; }
#scErr { position: fixed; z-index: 1000; left: 50%; top: 12px; transform: translateX(-50%); width: min(560px, calc(100vw - 24px)); box-sizing: border-box; padding: 12px 40px 12px 14px; border-radius: 10px; background: #3a1418; border: 1px solid #e0475a; color: #f6e9ea; font: 14px/1.45 system-ui, -apple-system, sans-serif; box-shadow: 0 6px 24px rgba(0,0,0,.5); }
#scErr[hidden] { display: none; }
#scErr b { color: #fff; }
#scErr button { position: absolute; top: 6px; right: 8px; border: 0; background: none; color: #f6e9ea; font-size: 22px; line-height: 1; cursor: pointer; padding: 4px; }
/* readouts: short "label value" lines (1° and 2° swell, wind, buoy) instead of sentences */
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 3px 12px; margin: 8px 0 0; font-size: .86rem; line-height: 1.4; color: var(--fg); }
.kv dt { font-family: var(--mono); font-size: .74rem; color: var(--fg-3); padding-top: .1rem; white-space: nowrap; }
.kv dd { margin: 0; min-width: 0; }
.kv dt.kv-h { grid-column: 1 / -1; text-transform: uppercase; letter-spacing: .06em; font-size: .66rem; padding-top: 2px; }
ul.tight { margin: 6px 0; padding-left: 18px; } ul.tight li { margin: 2px 0; } ul.tight li::marker { color: var(--fg-3); }
.tr-k { display: flex; gap: 18px; font-size: .8rem; color: var(--fg-3); }
.tr-k span { position: relative; padding-left: 22px; } .tr-k i { width: 16px; height: 10px; top: 3px; } .tr-k i.r { height: 6px; top: 5px; }
.dct { min-width: 0; } .dct td, .dct th { white-space: normal; }
.qs { margin: 4px 0 0; padding-left: 1.3em; display: grid; gap: 6px; }
.qs a { color: var(--fg); text-decoration-color: var(--swell); text-underline-offset: 3px; }
/* the two research questions, answered at the top: each card links to its section */
.qa-box { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; margin-top: 4px; }
.qa { display: grid; gap: 6px; align-content: start; padding: 14px 16px; border: 1px solid var(--rule); border-top: 2px solid var(--swell); border-radius: 8px; background: var(--panel); color: var(--fg); text-decoration: none; }
.qa:hover, .qa:focus-visible { border-color: var(--fg-3); border-top-color: var(--swell); }
.qa b { font-family: var(--display); font-size: 1.3rem; font-weight: 600; line-height: 1.2; }
.qa > span:last-child { color: var(--fg-2); font-size: 0.95rem; }
.qa .mono { color: var(--fg); }
.qs-more { color: var(--fg-2); font-size: 0.92rem; }
.qs-more a { color: var(--fg); text-decoration-color: var(--swell); text-underline-offset: 3px; }
/* Question 1: buoy and model side by side, stacked on a phone */
.q1-pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 18px; }
.q1-pair > div { min-width: 0; }
/* Question 2: where the swell on Choc's 3 ft+ days came from, as plain bars (readable at any width) */
.share-rows { display: grid; gap: 14px; }
.share-row { display: grid; grid-template-columns: minmax(150px, 250px) 1fr; gap: 12px; align-items: center; }
.share-lab b { display: block; font-weight: 600; }
.share-lab span { color: var(--fg-2); font-size: 0.85rem; }
.share-bar { display: flex; align-items: center; gap: 10px; min-width: 0; }
.share-bar i { display: block; flex: none; height: 22px; border-radius: 0 4px 4px 0; background: var(--fg-3); }
.share-row.in .share-bar i { background: var(--swell); }
.share-val { white-space: nowrap; color: var(--fg-2); font-size: 0.85rem; }
.share-val b { color: var(--fg); font-size: 1.05rem; }
@media (max-width: 520px) { .share-row { grid-template-columns: 1fr; gap: 6px; } }
details.more { border-top: 1px solid var(--rule); padding-block: 10px; }
details.more > summary { cursor: pointer; font-family: var(--display); font-size: 1.15rem; color: var(--fg); list-style: none; }

details.more[open] > summary::before { content: '− '; }
details.more > section, details.more > figure { margin-top: 14px; }

/* charts */
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.scroll { overflow-x: auto; }
.takeaways { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; }
.take { border-top: 2px solid var(--swell); padding-top: 10px; display: grid; gap: 4px; align-content: start; }
.take b { font-family: var(--display); font-size: 1.9rem; font-weight: 600; line-height: 1; }
.take span { font-size: 0.88rem; color: var(--fg-2); }
.multiples { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }
.multiples > div { min-width: 0; }
.mlabel { font-size: 0.78rem; color: var(--fg-2); display: flex; justify-content: space-between; gap: 8px; }

table { border-collapse: collapse; width: 100%; font-size: 0.85rem; min-width: 560px; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--rule); white-space: nowrap; }

td.num, th.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
tr.clickable { cursor: pointer; }
tr.clickable:hover td { background: #121c26; }
ol, ul { margin: 0; padding-left: 1.2em; color: var(--fg-2); display: grid; gap: 8px; max-width: 65ch; }
li strong { color: var(--fg); }
.formula { font-family: var(--mono); background: var(--panel); border: 1px solid var(--rule); border-radius: 4px; padding: 12px 14px; color: var(--fg); font-size: 0.95rem; }
.callout { border-left: 3px solid var(--offshore); padding-left: 14px; }
#tip { position: fixed; pointer-events: none; background: #172331; border: 1px solid #2f4152; color: var(--fg); font-size: 0.8rem; padding: 6px 9px; border-radius: 4px; z-index: 10; max-width: 260px; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }

/* forward rays */
.fr-maps { display: grid; grid-template-columns: 1.15fr 1fr; gap: 12px; margin-top: 10px; }
@media (max-width: 760px) { .fr-maps { grid-template-columns: 1fr; } }
.fr-maps canvas { width: 100%; display: block; border-radius: 6px; }
.fr-cap { font-family: var(--mono); font-size: .7rem; letter-spacing: .06em; text-transform: uppercase; color: var(--fg-3); margin-bottom: 4px; }
.fr-note { font-size: .74rem; color: var(--swell); margin: 6px 0 0; min-height: 1em; }
.fr-out { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px; }
@media (max-width: 620px) { .fr-out { grid-template-columns: 1fr; } }
.fr-card { border: 1px solid var(--rule); border-left: 3px solid var(--zc); border-radius: 8px; padding: 10px 12px; }
.fr-n { font-family: var(--mono); font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: var(--zc); }
.fr-big { font-family: var(--display); font-size: 2rem; line-height: 1.1; } .fr-big small { font-family: var(--body); font-size: .85rem; color: var(--fg-2); }
.fr-row { display: grid; grid-template-columns: 1.3fr 1fr; gap: 10px; } .fr-k { font-family: var(--mono); font-size: .66rem; letter-spacing: .06em; text-transform: uppercase; color: var(--fg-3); }
.fr-shape { font-size: 1.5rem !important; padding-top: 4px; }
.fr-l { font-size: .86rem; color: var(--fg-2); margin-top: 4px; } .fr-l b { color: var(--fg); font-weight: 500; }

/* the map: one stage with its controls laid over it, like a weather app. Wider than the

.hub { width: min(100vw - 32px, 1200px); margin-inline: calc(50% - min(50vw - 16px, 600px)); }

.trip-stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: none; }
.trip-stage::after { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 96px; pointer-events: none; background: linear-gradient(to bottom, rgba(7,11,16,.72), rgba(7,11,16,0)); }
.trip-stage.hub-max { position: fixed; inset: 0; z-index: 1000; width: 100vw; height: 100%; height: 100dvh; border-radius: 0; }
html.hub-lock, html.hub-lock body { overflow: hidden; }
.trip-hud { z-index: 1; position: absolute; left: 12px; top: 10px; right: 62px; pointer-events: none; text-shadow: 0 1px 6px rgba(0,0,0,.9); display: grid; gap: 2px; }
.trip-stage.hub-wide.hub-pn .trip-hud { right: 296px; }
.trip-phase { font-family: var(--display); font-size: clamp(1.1rem, 3.2vw, 1.45rem); line-height: 1.15; color: var(--fg); }
.trip-line { font-size: 0.75rem; color: var(--fg-2); }
.trip-pow { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-top: 4px; font-family: var(--body); font-size: .82rem; color: var(--fg-2); }

.trip-bar { position: relative; width: 120px; height: 8px; border-radius: 4px; background: rgba(255,255,255,.15); overflow: hidden; }
.trip-bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--cool); }
.trip-bar b { position: absolute; left: 50%; top: -2px; bottom: -2px; width: 2px; background: #fff; }
#tripPowV { color: var(--fg); font-weight: 500; }
.trip-powh { flex-basis: 100%; }
.hub-tr { position: absolute; z-index: 3; top: 10px; right: 10px; display: grid; gap: 8px; }
.hub-ib { width: 40px; height: 40px; padding: 0; display: grid; place-items: center; border-radius: 10px; background: rgba(10,15,21,.8); border: 1px solid rgba(255,255,255,.16); color: var(--fg); }
.hub-ib:hover { background: rgba(35,56,74,.95); }

.hub-ib[aria-pressed="true"] .i-min { display: block; }
.hub-panel, .hub-info { box-sizing: border-box; position: absolute; z-index: 3; top: 10px; right: 60px; max-height: calc(100% - var(--botH, 0px) - 20px); overflow-y: auto; overscroll-behavior: contain; background: rgba(10,15,21,.9); border: 1px solid rgba(255,255,255,.12); border-radius: 12px; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); box-shadow: 0 10px 28px rgba(0,0,0,.4); }
.hub-panel { width: 206px; display: grid; gap: 14px; align-content: start; padding: 12px; }
.hub-g { display: grid; gap: 6px; }
.hub-h { font: 500 .64rem var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--fg-3); }
.hub-seg { display: flex; width: 100%; }

.hub-tg { display: flex; align-items: center; gap: 9px; width: 100%; padding: 6px 4px; background: transparent; border: 0; border-radius: 6px; color: var(--fg-2); font-size: .83rem; text-align: left; }
.hub-tg:hover { background: rgba(255,255,255,.06); }

.hub-row { display: flex; flex-wrap: wrap; gap: 8px 12px; }

.hub-col { display: grid; gap: 6px; }

.hub-ic { display: grid; gap: 10px; }

.hub-info p { font-size: .84rem; }
.hub-fine, .hub-info p.hub-fine, .hub-info ul.hub-fine { font-size: .74rem; color: var(--fg-3); }

.hub-chip { min-width: 0; font-size: .8rem; padding: 7px 13px; border-radius: 999px; background: rgba(10,15,21,.86); border: 1px solid rgba(240,138,75,.6); color: var(--fg); text-align: left; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }

.hub-chip { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
