name: Update Buoy Data

on:
  schedule:
    - cron: '15 */2 * * *'  # Every 2 hours at :15
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write

# One run at a time; a queued run waits instead of cancelling one that is
# mid-push.
concurrency:
  group: update-buoy
  cancel-in-progress: false

jobs:
  update-buoy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      # Exits 1 without writing when every NDBC file fails, which skips the
      # commit below and makes GitHub email the owner.
      - name: Fetch buoy data
        run: python scripts/fetch_buoy.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/buoy.json data/verification.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update buoy data $(date -u +'%Y-%m-%d %H:%M UTC')"
            # main may have moved since checkout (e.g. the owner merged a
            # PR): replay the data commit on top of it, with a few retries.
            for attempt in 1 2 3; do
              if git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              echo "::warning::Push attempt $attempt failed; retrying"
              sleep $((attempt * 5))
            done
            echo "::error::Could not push the buoy data commit after 3 attempts"
            exit 1
          fi
