name: Update Sound Check history

# The Sound Check's history since 2016 (scripts/history/update.py): every day it fetches buoy 44097's spectra
# (CDIP) and readings (NDBC), the over-water wind (ERA5, ECMWF) and the tides, rebuilds the whole history through
# yesterday, and commits what changed to main: data/history/, research/hist.js and the Block Island lane of
# research/ocean/day/. Rebuilding everything (about 5 minutes) means late or corrected readings anywhere in the
# ten years land too. A run that fails commits nothing, so the site keeps the last good history, and GitHub
# emails the owner.
# It also reads the crew's surf log (Firestore surf_logs) with the read-only key in the SURFLOG_READ_KEY secret and
# fits the ratings model, the sessions' statistics and the forecast scorecard (research/fc/score.json) to it, so a
# logged session counts from the next run. Without the secret, or when the log can't be read, those stay as they
# are (scripts/history/README.md says how to add it).
on:
  schedule:
    # four times a day: GitHub drops many scheduled runs (the buoy bot's every-2-h schedule ran 3 times on 14 Oct and
    # the first 09:23 run never started), and every run rebuilds the whole history, so a later one catches up; a run
    # that finds nothing new commits nothing. 09:23 UTC is 5:23 AM EDT / 4:23 AM EST: yesterday is complete by then
    - cron: '23 9,13,17,21 * * *'
  workflow_dispatch:      # Manual trigger
  push:                   # first update as soon as this lands, and after any change to the update
    branches: [main]
    paths:
      - 'scripts/history/**'
      - '.github/workflows/update-history.yml'

permissions:
  contents: write

concurrency:
  group: update-history
  cancel-in-progress: false

jobs:
  update-history:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HISTORY_CACHE: ${{ github.workspace }}/history-cache
    steps:
      # the branch as it is now, not the commit that started the run: a run that waited in the queue then builds on
      # the one before it, and its commit lands on top without a conflict
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # google-auth and requests: the service account's token for Firestore. Pillow and eccodes: the scorecard reads
      # GFS-Wave's archived forecasts for new sessions as the forecast bot does (same versions as update-forecast.yml)
      - name: Install dependencies
        run: pip install numpy==2.4.6 scipy==1.17.1 pillow==12.3.0 eccodes==2.49.0 google-auth==2.58.1 requests==2.34.2

      # CDIP's spectra archive (about 750 MB) changes every month or two: keep it between runs, keyed by its
      # date, so it is downloaded only when CDIP updates it.
      - name: Date of the CDIP archive
        id: cdip
        run: |
          stamp=$(curl -sSIL --retry 3 https://thredds.cdip.ucsd.edu/thredds/fileServer/cdip/archive/154p1/154p1_historic.nc \
            | tr -d '\r' | awk 'tolower($1) == "last-modified:" { $1 = ""; print }' | tail -1 | tr -cs 'A-Za-z0-9' '-')
          echo "stamp=$stamp" >> "$GITHUB_OUTPUT"

      - name: Restore the CDIP archive
        uses: actions/cache@v4
        with:
          path: history-cache/cdip/154p1_historic.nc*
          key: history-cdip-${{ steps.cdip.outputs.stamp }}

      # The files that don't change once published (NDBC's finished years and months, Montauk 44017, the tide
      # tables, ERA5 for 2016), refreshed once a month; the rest is fetched every run. (Folders listed one by one:
      # an exclusion like !history-cache/cdip doesn't keep the archive out of this cache.)
      - name: This month (the published files' cache key)
        id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Restore the published files
        uses: actions/cache@v4
        with:
          path: |
            history-cache/ndbc
            history-cache/ndbc17
            history-cache/tides
            history-cache/wind
          key: history-inputs-${{ steps.month.outputs.month }}
          restore-keys: history-inputs-

      # Exits non-zero when a source fails with nothing cached, or the files can't be brought to one last day:
      # the commit below is skipped.
      - name: Rebuild the history through yesterday
        id: update
        env:
          SURFLOG_READ_KEY: ${{ secrets.SURFLOG_READ_KEY }}
        run: |
          # (an assignment, so a failed update fails the step: inside echo's arguments bash would ignore it)
          end=$(python scripts/history/update.py)
          echo "end=$end" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history research/hist.js research/ocean/day research/fc/score.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Sound Check history through ${{ steps.update.outputs.end }}"
            # main may have moved since checkout (e.g. the owner merged a PR): replay the data commit on top of
            # it, with a few retries.
            for attempt in 1 2 3; do
              if git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              echo "::warning::Push attempt $attempt failed; retrying"
              sleep $((attempt * 5))
            done
            echo "::error::Could not push the history commit after 3 attempts"
            exit 1
          fi
