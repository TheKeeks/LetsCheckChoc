name: CI

# Runs the same commands a Claude Code web session runs (see CLAUDE.md).
# Bot buoy-data commits only touch data/** and are skipped.
on:
  push:
    paths-ignore:
      - 'data/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Unit (node:test + test-gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  python:
    name: Python (fetch_buoy.py)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run test:py

  e2e:
    name: E2E (Playwright, chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: tests/e2e/artifacts/
          if-no-files-found: ignore
          retention-days: 14
