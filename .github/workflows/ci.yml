name: CI

# Runs the same commands a Claude Code web session runs (see CLAUDE.md).
# Bot commits only touch data files and are skipped: the buoy bot's data/**,
# the history bot's data/history/**, research/hist.js and research/ocean/day/**;
# so is the forecast bot's fc-data branch (forecast files only, no code to test).
on:
  push:
    branches-ignore:
      - 'fc-data'
    paths-ignore:
      - 'data/**'
      - 'research/hist.js'
      - 'research/ocean/day/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Unit (node:test + test-gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  python:
    name: Python (fetch_buoy.py)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # the Sound Check forecast pull (scripts/forecast/fcpull.py, tested in scripts/test_fcpull.py) reads GRIB with
      # eccodes; same versions as .github/workflows/update-forecast.yml. The history update (scripts/history/,
      # tested in scripts/test_history.py) reads CDIP's NetCDF with scipy, as .github/workflows/update-history.yml
      - run: pip install numpy==2.4.6 pillow==12.3.0 eccodes==2.49.0 scipy==1.17.1
      - run: npm run test:py

  e2e:
    name: E2E (Playwright, chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # The map's sea-floor grids (~120 MB) live in their own repo; the runner serves them from map-data/.
      - uses: actions/checkout@v4
        with:
          repository: TheKeeks/LetsCheckChoc-data
          path: map-data
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: tests/e2e/artifacts/
          if-no-files-found: ignore
          retention-days: 14
