<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Swell Forecast — Chocomount Beach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,700;0,900;1,900&family=Noto+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow-x: hidden;
    background: #07080f;
    font-family: 'Noto Sans', system-ui, sans-serif;
    color: #e6e8f2;
    min-height: 100vh;
  }
  #root {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 16px 64px;
    gap: 0;
  }
  .fn-card {
    position: relative;
    width: 860px;
    max-width: 100%;
    background: #0f1120;
    padding: 20px 24px 18px;
    border-radius: 6px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.55);
    box-sizing: border-box;
    margin: 0 auto 16px;
  }
  .fn-section-head {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 2px;
  }
  .fn-section-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-style: italic;
    font-size: 22px;
    letter-spacing: 0.04em;
    color: #e6e8f2;
    text-transform: uppercase;
    line-height: 1;
  }
  .fn-section-pill {
    display: inline-block;
    background: #ffffff;
    color: #0a0c18;
    font-family: 'Noto Sans', sans-serif;
    font-weight: 700;
    font-size: 10px;
    letter-spacing: 0.16em;
    padding: 3px 9px;
    border-radius: 3px;
    text-transform: uppercase;
  }
  .fn-section-sub {
    width: 100%;
    font-family: 'Noto Sans', sans-serif;
    font-size: 12px;
    letter-spacing: 0.02em;
    color: #8a90a8;
    margin-top: 2px;
    margin-bottom: 12px;
  }
  .fn-chart-wrap {
    position: relative;
    z-index: 1;
    background: #0a0c18;
    border: 1px solid #1a1d33;
    border-radius: 4px;
    padding: 12px;
  }
  .fn-chart-wrap svg { display: block; width: 100%; height: auto; }
  .fn-legend {
    position: relative;
    z-index: 1;
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    margin-top: 12px;
    font-family: 'Noto Sans', sans-serif;
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 0.02em;
    color: #cfd3e6;
  }
  .fn-legend-item { display: inline-flex; align-items: center; gap: 8px; }
  .fn-legend-dot {
    width: 10px; height: 10px; border-radius: 50%;
    display: inline-block;
  }
  .fn-statusbar {
    position: relative;
    z-index: 1;
    margin-top: 10px;
    padding: 6px 0;
    font-family: 'Noto Sans', sans-serif;
    font-size: 12px;
    color: #8a90a8;
    min-height: 18px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .fn-status-badge {
    display: inline-block;
    padding: 2px 8px;
    font-family: 'Noto Sans', sans-serif;
    font-weight: 700;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #0a0c18;
    border-radius: 3px;
  }
  .fn-status-key {
    color: #6c7091;
    text-transform: uppercase;
    font-family: 'Noto Sans', sans-serif;
    font-size: 11px;
    letter-spacing: 0.1em;
    margin-right: 4px;
  }
  .fn-status-val { color: #e6e8f2; font-weight: 600; }
  .fn-placeholder {
    font-family: 'Noto Sans', sans-serif;
    font-size: 13px;
    color: #6c7091;
    text-align: center;
    padding: 24px 0;
  }
  .fn-inline-note {
    font-family: 'Noto Sans', sans-serif;
    font-size: 12px;
    color: #8a90a8;
  }
  .fn-lineup {
    width: 860px;
    max-width: 100%;
    margin: 0 auto 16px;
    position: relative;
    box-sizing: border-box;
    background: #0f1120;
    padding: 20px 24px 18px;
    border-radius: 6px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.55);
  }
  .fn-lineup-frame {
    position: relative;
    width: 100%;
    background: #1a1a1a;
    line-height: 0;
    border-radius: 4px;
    overflow: hidden;
    margin-top: 4px;
  }
  .fn-lineup-legend {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    margin-top: 10px;
    font-family: 'Noto Sans', sans-serif;
    font-size: 12px;
    color: #cfd3e6;
  }
  .fn-lineup-legend-item {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .fn-lineup-legend-swatch {
    display: inline-block;
    width: 16px; height: 2px;
    position: relative;
    vertical-align: middle;
  }
  .fn-lineup-legend-swatch::after {
    content: "";
    position: absolute;
    right: -4px; top: -3px;
    border-left: 5px solid currentColor;
    border-top: 4px solid transparent;
    border-bottom: 4px solid transparent;
  }
  .fn-lineup-img {
    display: block;
    width: 100%;
    height: auto;
  }
  .fn-lineup-placeholder {
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #1a1a1a;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #6c7091;
    font-family: 'Noto Sans', sans-serif;
    font-size: 13px;
    letter-spacing: 0.02em;
  }
  .fn-lineup-overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .fn-sources {
    position: relative;
    z-index: 1;
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
  }
  .fn-sources-header {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    user-select: none;
    font-family: 'Noto Sans', sans-serif;
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #8a90a8;
    padding: 2px 0;
  }
  .fn-sources-header:hover { color: #cfd3e6; }
  .fn-sources-caret {
    display: inline-block;
    color: #8a90a8;
    font-size: 11px;
    line-height: 1;
  }
  .fn-sources-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 8px 0 2px;
  }
  .fn-sources-link {
    font-family: 'Noto Sans', sans-serif;
    font-size: 12px;
    letter-spacing: 0.02em;
    color: #a9b0c7;
    text-decoration: none;
  }
  .fn-sources-link:hover { color: #cfd3e6; text-decoration: underline; }

  .fn-rose-card {
    position: relative;
    width: 860px;
    max-width: 100%;
    margin: 0 auto 16px;
    background: #0f1120;
    padding: 20px 24px 18px;
    border-radius: 6px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.55);
    box-sizing: border-box;
  }
  .fn-rose-head {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 2px;
  }
  .fn-live-badge {
    display: inline-block;
    background: #ffffff;
    color: #0a0c18;
    font-family: 'Noto Sans', sans-serif;
    font-weight: 700;
    font-size: 10px;
    letter-spacing: 0.16em;
    padding: 3px 9px;
    border-radius: 3px;
    text-transform: uppercase;
    position: relative;
  }
  .fn-live-badge::before {
    content: "";
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #ff4747;
    margin-right: 6px;
    vertical-align: middle;
    animation: fn-live-pulse 1.8s ease-in-out infinite;
  }
  @keyframes fn-live-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }
  .fn-rose-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-style: italic;
    font-size: 22px;
    letter-spacing: 0.04em;
    color: #e6e8f2;
    text-transform: uppercase;
    line-height: 1;
  }
  .fn-rose-station {
    font-family: 'Noto Sans', sans-serif;
    font-size: 12px;
    letter-spacing: 0.02em;
    color: #8a90a8;
    margin-top: 2px;
    margin-bottom: 8px;
    width: 100%;
  }
  .fn-rose-timestamp {
    font-family: 'Noto Sans', sans-serif;
    font-size: 12px;
    color: #cfd3e6;
    margin-top: 2px;
    margin-bottom: 4px;
  }
  .fn-rose-timestamp .fn-rose-rel {
    color: #6c7091;
    margin-left: 6px;
  }
  .fn-rose-canvas-wrap {
    position: relative;
    margin-top: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    padding: 10px;
    border: 1px solid #1a1d33;
    min-height: 260px;
    transition: opacity 200ms;
  }
  .fn-rose-canvas-wrap.fn-rose-faded { opacity: 0.35; }
  .fn-rose-canvas { display: block; max-width: 100%; }
  .fn-rose-overlay-msg {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    padding: 12px;
    text-align: center;
  }
  .fn-rose-overlay-inner {
    background: rgba(15, 17, 32, 0.88);
    padding: 8px 12px;
    border-radius: 3px;
    font-family: 'Noto Sans', sans-serif;
    font-size: 12px;
    color: #8a90a8;
    max-width: 90%;
  }
  .fn-rose-legend {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    margin-top: 12px;
    font-family: 'Noto Sans', sans-serif;
    font-size: 12px;
    letter-spacing: 0.02em;
    color: #a9b0c7;
  }
  .fn-rose-legend-key { color: #6c7091; margin-right: 4px; }
  .fn-rose-ramp {
    display: inline-block;
    width: 72px;
    height: 8px;
    background: linear-gradient(to right,
      rgb(90,127,160) 0%,
      rgb(58,125,125) 25%,
      rgb(58,125,86) 45%,
      rgb(184,122,46) 75%,
      rgb(138,58,46) 100%);
    vertical-align: middle;
    margin: 0 6px;
  }
  .fn-rose-disclaimer {
    margin-top: 10px;
    font-family: 'Noto Sans', sans-serif;
    font-size: 11px;
    color: #6c7091;
    font-style: italic;
    line-height: 1.4;
  }
  .fn-live-badge.fn-live-badge-dim {
    background: #4a4d5e;
    color: #d6d9ea;
    cursor: pointer;
  }
  .fn-live-badge.fn-live-badge-dim::before {
    background: #8a90a8;
    animation: none;
    opacity: 0.7;
  }
  .fn-live-badge.fn-live-badge-dim:hover,
  .fn-live-badge.fn-live-badge-dim:focus {
    background: #5a5d72;
    outline: none;
  }
  .fn-rose-viewing-pill {
    display: inline-block;
    background: rgba(255, 71, 71, 0.16);
    border: 1px solid rgba(255, 71, 71, 0.55);
    color: #ff9b9b;
    font-family: 'Noto Sans', sans-serif;
    font-weight: 700;
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 3px;
  }
  .fn-rose-history-wrap {
    margin-top: 14px;
    padding: 0 6px;
  }
  .fn-rose-history-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-family: 'Noto Sans', sans-serif;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #6c7091;
    margin-bottom: 8px;
  }
  .fn-rose-history-time {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.04em;
    color: #e6e8f2;
    text-transform: none;
  }
  .fn-rose-slider {
    position: relative;
    height: 26px;
    width: 100%;
  }
  .fn-rose-slider input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    position: absolute;
    left: 0; top: 10px;
    width: 100%; height: 4px;
    background: #2a2d44;
    border-radius: 2px;
    outline: none;
    margin: 0; padding: 0;
    cursor: pointer;
    z-index: 2;
  }
  .fn-rose-slider input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: #ffffff;
    border: 2px solid #ff4747;
    cursor: pointer;
    margin-top: -6px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.55);
  }
  .fn-rose-slider input[type="range"]::-moz-range-thumb {
    width: 16px; height: 16px;
    border-radius: 50%;
    background: #ffffff;
    border: 2px solid #ff4747;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.55);
  }
  .fn-rose-ticks {
    position: absolute;
    left: 0; right: 0; top: 16px;
    height: 8px;
    pointer-events: none;
  }
  .fn-rose-tick {
    position: absolute;
    top: 2px;
    width: 1px;
    height: 4px;
    background: #4a5070;
    transform: translateX(-50%);
  }
  .fn-rose-tick.fn-rose-tick-major {
    top: 0;
    height: 8px;
    width: 2px;
    background: #8a90b3;
  }
  .fn-rose-tick-labels {
    position: relative;
    height: 14px;
    margin-top: 2px;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: #8a90b3;
  }
  .fn-rose-tick-label {
    position: absolute;
    top: 0;
    transform: translateX(-50%);
    white-space: nowrap;
  }
  .fn-rose-toast {
    position: absolute;
    left: 50%; top: 12px;
    transform: translateX(-50%);
    background: rgba(15, 17, 32, 0.96);
    border-radius: 3px;
    color: #cfd3e6;
    padding: 6px 12px;
    font-family: 'Noto Sans', sans-serif;
    font-size: 12px;
    z-index: 5;
    box-shadow: 0 6px 16px rgba(0,0,0,0.55);
    animation: fn-rose-toast-in 250ms ease;
    pointer-events: none;
  }
  @keyframes fn-rose-toast-in {
    from { opacity: 0; transform: translate(-50%, -8px); }
    to   { opacity: 1; transform: translate(-50%, 0); }
  }

  /* ── Tab pills (Cards 2 & 3 model selector) ── */
  .fn-tab-pills {
    display: inline-flex;
    gap: 6px;
    margin-top: 8px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .fn-tab-pill {
    background: #1a1d33;
    color: #8a90a8;
    font-family: 'Noto Sans', sans-serif;
    font-weight: 700;
    font-size: 10px;
    letter-spacing: 0.16em;
    padding: 4px 10px;
    border-radius: 3px;
    text-transform: uppercase;
    cursor: pointer;
    border: 1px solid #1a1d33;
    line-height: 1.4;
  }
  .fn-tab-pill:hover { background: #2a2d44; color: #cfd3e6; }
  .fn-tab-pill.active {
    background: #ffffff;
    color: #0a0c18;
    border-color: #ffffff;
  }
  .fn-tab-pill.active:hover { background: #ffffff; color: #0a0c18; }

  /* ── Predicted Score Timeline overlay (mirrors live spectral) ── */
  .fn-pred-overlay-msg {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    padding: 12px;
    text-align: center;
    z-index: 4;
  }

  /* ── Photo modal (used by scatter card on tap) ── */
  .fn-photo-modal {
    position: fixed;
    inset: 0;
    background: rgba(7, 8, 15, 0.92);
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .fn-photo-modal img {
    max-width: 100%;
    max-height: 100%;
    border-radius: 4px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.65);
  }
  .fn-photo-modal-close {
    position: absolute;
    top: 16px; right: 16px;
    background: rgba(15, 17, 32, 0.85);
    color: #e6e8f2;
    border: 1px solid #1a1d33;
    border-radius: 3px;
    font-family: 'Noto Sans', sans-serif;
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.14em;
    padding: 6px 12px;
    cursor: pointer;
    text-transform: uppercase;
  }

  @media (pointer: coarse) {
    #root { padding: 12px 0; }
    .fn-card {
      width: calc(100vw - 16px);
      max-width: none;
      margin: 0 8px 12px;
      padding: 12px 14px;
      box-sizing: border-box;
    }
    .fn-section-head { margin-bottom: 2px; }
    .fn-chart-wrap { padding: 40px 8px 8px; }
    .fn-lineup {
      width: calc(100vw - 16px);
      max-width: none;
      margin: 0 8px 12px;
      padding: 12px 14px;
    }
    .fn-rose-card {
      width: calc(100vw - 16px);
      max-width: none;
      margin: 0 8px 12px;
      padding: 14px 14px 12px;
    }
    .fn-rose-title { font-size: 17px; }
    .fn-rose-slider input[type="range"]::-webkit-slider-thumb {
      width: 22px; height: 22px; margin-top: -9px;
    }
    .fn-rose-slider input[type="range"]::-moz-range-thumb {
      width: 22px; height: 22px;
    }
    .fn-rose-slider { height: 32px; }
    .fn-rose-ticks { top: 18px; }
  }
</style>
</head>

<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;

// BEARING AUDIT
// Grep run on project/Swell Forecast.html for: 340, 334, 334.25, 325, 335,
// reefHeading, reefBearing, reefDirection, headingDegrees, OFFSHORE_CENTER, "reef".
//
// Matches found (pre-change):
//   line 217: const OFFSHORE_CENTER = 340;            ← reef facing direction (offshore-center). NORMALIZED to 335.
//   line 249: const d = angularDist(dir, OFFSHORE_CENTER);  ← consumer of the constant. Unchanged.
//
// No occurrences of: 334, 334.25, 325, reefHeading, reefBearing, reefDirection, headingDegrees.
// Other bearing-related values in the file are dynamic per-hour data (h.windDir, h.swellDir,
// rot variables, etc.) — those are NOT the spot's facing direction and were left alone.
// END BEARING AUDIT

// SWELL WINDOW AUDIT
// Grep run on project/Swell Forecast.html for: 115, 158, swellWindow, exposureMin,
// exposureMax, windowStart, windowEnd.
//
// Matches found (pre-change): none. No prior constants or literals for the swell
// exposure window existed in this file. Added SWELL_WINDOW_MIN = 115 and
// SWELL_WINDOW_MAX = 158 as named constants below (bearings the swell must come
// FROM to hit the reef; asymmetric around the reef's back-azimuth of 155°).
// END SWELL WINDOW AUDIT

const REEF_HEADING_DEG = 335;
const OFFSHORE_CENTER = REEF_HEADING_DEG;
const SWELL_WINDOW_MIN = 115; // SE bound (degrees, direction swell comes FROM)
const SWELL_WINDOW_MAX = 158; // SE bound (degrees, direction swell comes FROM)
const LAT_MARINE = 41.089152, LON_MARINE = -71.721050;
const LAT_WIND   = 41.275693, LON_WIND   = -71.963310;

// LIVE spectral buoy — NDBC station supplying realtime directional wave spectra
// for the observed-spectrum rose. Swap this constant to fall back to another
// nearby station (e.g. 44025 Long Island, 44017 Montauk) if 44097 is offline.
const SPECTRAL_BUOY_STATION = '44097';
const SPECTRAL_BUOY_NAME = 'Block Island, RI';
// NDBC text endpoints don't send permissive CORS headers, so proxy the fetch.
// Matches the list used by the main app (index.html / app.js).
const NDBC_PROXIES = [
  { prefix: 'https://corsproxy.io/?', encode: true },
  { prefix: 'https://api.allorigins.win/raw?url=', encode: true }
];
const NDBC_BASE = 'https://www.ndbc.noaa.gov/data/realtime2/';
const SPECTRAL_REFRESH_MS = 10 * 60 * 1000;   // re-fetch every 10 min
const SPECTRAL_STALE_MS   = 3  * 60 * 60 * 1000; // >3h old = stale

const IS_MOBILE = typeof window !== 'undefined'
  && window.matchMedia
  && window.matchMedia('(pointer: coarse)').matches;

const QUALITY_COLORS = {
  good: '#57e649',
  fair: '#fb923c',
  poor: '#ff4747',
};

const QUALITY_LABELS = {
  good: 'Offshore wind',
  fair: 'Cross-shore wind',
  poor: 'Onshore wind',
};

const LEGEND = [
  { label: QUALITY_LABELS.good, color: QUALITY_COLORS.good },
  { label: QUALITY_LABELS.fair, color: QUALITY_COLORS.fair },
  { label: QUALITY_LABELS.poor, color: QUALITY_COLORS.poor },
];

const COMPASS = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
function degToCompass(deg) {
  if (deg == null) return '';
  const idx = Math.round(((deg % 360) + 360) % 360 / 22.5) % 16;
  return COMPASS[idx];
}

function angularDist(a, b) {
  return Math.abs(((a - b) % 360 + 540) % 360 - 180);
}

function windQ(dir) {
  const d = angularDist(dir, OFFSHORE_CENTER);
  if (d <= 45) return 'good';
  if (d <= 90) return 'fair';
  return 'poor';
}

async function fetchForecastData() {
  const marineUrl = 'https://marine-api.open-meteo.com/v1/marine'
    + '?latitude=' + LAT_MARINE
    + '&longitude=' + LON_MARINE
    + '&hourly=swell_wave_height,swell_wave_direction,swell_wave_period'
    + ',secondary_swell_wave_height,secondary_swell_wave_period,secondary_swell_wave_direction'
    + '&length_unit=imperial'
    + '&timezone=auto'
    + '&forecast_days=7';

  const windUrl = 'https://api.open-meteo.com/v1/forecast'
    + '?latitude=' + LAT_WIND
    + '&longitude=' + LON_WIND
    + '&hourly=wind_speed_10m,wind_direction_10m,wind_gusts_10m'
    + '&wind_speed_unit=mph'
    + '&timezone=auto'
    + '&forecast_days=7';

  const [marineRes, windRes] = await Promise.all([
    fetch(marineUrl),
    fetch(windUrl),
  ]);

  if (!marineRes.ok) {
    throw new Error('Marine API ' + marineRes.status + ' ' + marineRes.statusText);
  }
  if (!windRes.ok) {
    throw new Error('Wind API ' + windRes.status + ' ' + windRes.statusText);
  }

  const marine = await marineRes.json();
  const wind = await windRes.json();

  const mh = marine.hourly || {};
  const wh = wind.hourly || {};
  const times = mh.time || [];
  const count = Math.min(168, times.length);

  const hours = [];
  for (let i = 0; i < count; i++) {
    hours.push({
      time: times[i],
      waveFt:   mh.swell_wave_height ? mh.swell_wave_height[i] : null,
      period:   mh.swell_wave_period ? mh.swell_wave_period[i] : null,
      swellDir: mh.swell_wave_direction ? mh.swell_wave_direction[i] : null,
      secondarySwellHeight:    mh.secondary_swell_wave_height    ? mh.secondary_swell_wave_height[i]    : null,
      secondarySwellPeriod:    mh.secondary_swell_wave_period    ? mh.secondary_swell_wave_period[i]    : null,
      secondarySwellDirection: mh.secondary_swell_wave_direction ? mh.secondary_swell_wave_direction[i] : null,
      windMph:  wh.wind_speed_10m ? wh.wind_speed_10m[i] : null,
      windDir:  wh.wind_direction_10m ? wh.wind_direction_10m[i] : null,
      gustMph:  wh.wind_gusts_10m ? wh.wind_gusts_10m[i] : null,
    });
  }
  return hours;
}

const PLOT_LEFT = 40;
const PLOT_RIGHT = 760;
const PLOT_TOP = 16;
const PLOT_BOTTOM = 260;
const PLOT_WIDTH = PLOT_RIGHT - PLOT_LEFT;
const PLOT_HEIGHT = PLOT_BOTTOM - PLOT_TOP;
const Y_MAX = 14;

function xForIdx(i, n) {
  if (n <= 1) return PLOT_LEFT;
  return PLOT_LEFT + (i / (n - 1)) * PLOT_WIDTH;
}
function yForFt(ft) {
  const v = Math.max(0, Math.min(Y_MAX, ft || 0));
  return PLOT_BOTTOM - (v / Y_MAX) * PLOT_HEIGHT;
}

function sunTimes(date, lat) {
  const toRad = (d) => (d * Math.PI) / 180;
  const toDeg = (r) => (r * 180) / Math.PI;
  const norm360 = (v) => ((v % 360) + 360) % 360;
  const norm24 = (v) => ((v % 24) + 24) % 24;
  const y = date.getFullYear();
  const m = date.getMonth();
  const d = date.getDate();
  const day = Math.floor((Date.UTC(y, m, d) - Date.UTC(y, 0, 0)) / 86400000);
  const lngHour = LON_WIND / 15;
  const latRad = toRad(lat);
  const zenithCos = Math.cos(toRad(90.833));
  const calc = (isRise) => {
    const t = day + ((isRise ? 6 : 18) - lngHour) / 24;
    const M = 0.9856 * t - 3.289;
    let L = M + 1.916 * Math.sin(toRad(M)) + 0.02 * Math.sin(toRad(2 * M)) + 282.634;
    L = norm360(L);
    let RA = toDeg(Math.atan(0.91764 * Math.tan(toRad(L))));
    RA = norm360(RA);
    const Lquad = Math.floor(L / 90) * 90;
    const RAquad = Math.floor(RA / 90) * 90;
    RA = (RA + (Lquad - RAquad)) / 15;
    const sinDec = 0.39782 * Math.sin(toRad(L));
    const cosDec = Math.cos(Math.asin(sinDec));
    const cosH = (zenithCos - sinDec * Math.sin(latRad)) / (cosDec * Math.cos(latRad));
    if (cosH > 1) return 0;
    if (cosH < -1) return 12;
    let H = isRise ? 360 - toDeg(Math.acos(cosH)) : toDeg(Math.acos(cosH));
    H /= 15;
    const T = H + RA - 0.06571 * t - 6.622;
    const UT = norm24(T - lngHour);
    const tz = -new Date(y, m, d, 12, 0, 0, 0).getTimezoneOffset() / 60;
    return norm24(UT + tz);
  };
  return { sunriseHr: calc(true), sunsetHr: calc(false) };
}

function buildSmoothPath(points) {
  if (points.length === 0) return '';
  if (points.length === 1) return `M ${points[0].x} ${points[0].y}`;
  let d = `M ${points[0].x} ${points[0].y}`;
  for (let i = 0; i < points.length - 1; i++) {
    const p0 = points[i === 0 ? i : i - 1];
    const p1 = points[i];
    const p2 = points[i + 1];
    const p3 = points[i + 2] || p2;
    const c1x = p1.x + (p2.x - p0.x) / 6;
    const c1y = p1.y + (p2.y - p0.y) / 6;
    const c2x = p2.x - (p3.x - p1.x) / 6;
    const c2y = p2.y - (p3.y - p1.y) / 6;
    d += ` C ${c1x.toFixed(2)} ${c1y.toFixed(2)}, ${c2x.toFixed(2)} ${c2y.toFixed(2)}, ${p2.x.toFixed(2)} ${p2.y.toFixed(2)}`;
  }
  return d;
}

function SwellChart({ hours, hoveredIdx, onHover }) {
  const n = hours.length;
  const wrapRef = useRef(null);
  const [wrapWidth, setWrapWidth] = useState(0);
  useEffect(() => {
    const update = () => {
      if (wrapRef.current) setWrapWidth(wrapRef.current.clientWidth);
    };
    update();
    window.addEventListener('resize', update);
    return () => window.removeEventListener('resize', update);
  }, []);
  const points = useMemo(
    () => hours.map((h, i) => ({ x: xForIdx(i, n), y: yForFt(h.waveFt) })),
    [hours, n]
  );

  const linePath = useMemo(() => buildSmoothPath(points), [points]);

  const areaSegments = useMemo(() => {
    const segs = [];
    if (points.length < 2) return segs;
    for (let i = 0; i < points.length - 1; i++) {
      const p1 = points[i];
      const p2 = points[i + 1];
      const p0 = points[i === 0 ? i : i - 1];
      const p3 = points[i + 2] || p2;
      const c1x = p1.x + (p2.x - p0.x) / 6;
      const c1y = p1.y + (p2.y - p0.y) / 6;
      const c2x = p2.x - (p3.x - p1.x) / 6;
      const c2y = p2.y - (p3.y - p1.y) / 6;
      const q = windQ(hours[i].windDir);
      const d =
        `M ${p1.x} ${PLOT_BOTTOM} ` +
        `L ${p1.x} ${p1.y} ` +
        `C ${c1x.toFixed(2)} ${c1y.toFixed(2)}, ${c2x.toFixed(2)} ${c2y.toFixed(2)}, ${p2.x.toFixed(2)} ${p2.y.toFixed(2)} ` +
        `L ${p2.x} ${PLOT_BOTTOM} Z`;
      segs.push({ d, color: QUALITY_COLORS[q] });
    }
    return segs;
  }, [points, hours]);

  const dayDividers = useMemo(() => {
    const divs = [];
    if (!n) return divs;
    const xAt = (ms) => {
      const firstMs = new Date(hours[0].time).getTime();
      const lastMs = new Date(hours[n - 1].time).getTime();
      if (ms <= firstMs) return PLOT_LEFT;
      if (ms >= lastMs) return PLOT_RIGHT;
      for (let i = 0; i < n - 1; i++) {
        const a = new Date(hours[i].time).getTime();
        const b = new Date(hours[i + 1].time).getTime();
        if (ms >= a && ms <= b) {
          const f = (ms - a) / (b - a || 1);
          return xForIdx(i, n) + (xForIdx(i + 1, n) - xForIdx(i, n)) * f;
        }
      }
      return PLOT_RIGHT;
    };
    for (let i = 0; i < n; i++) {
      const t = new Date(hours[i].time);
      if (t.getHours() === 0 || i === 0) {
        const x = xForIdx(i, n);
        const label = t.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: '2-digit' })
          .replace(',', '');
        const sun = sunTimes(t, LAT_WIND);
        const midHour = (sun.sunsetHr > sun.sunriseHr)
          ? (sun.sunriseHr + sun.sunsetHr) / 2
          : 12;
        const midnight = new Date(t.getFullYear(), t.getMonth(), t.getDate()).getTime();
        const labelX = xAt(midnight + midHour * 3600000);
        divs.push({ x, label, i, labelX });
      }
    }
    return divs;
  }, [hours, n]);

  const sunMarkers = useMemo(() => {
    if (!n) return [];
    const xAt = (ms) => {
      const firstMs = new Date(hours[0].time).getTime();
      const lastMs = new Date(hours[n - 1].time).getTime();
      if (ms <= firstMs) return PLOT_LEFT;
      if (ms >= lastMs) return PLOT_RIGHT;
      for (let i = 0; i < n - 1; i++) {
        const a = new Date(hours[i].time).getTime();
        const b = new Date(hours[i + 1].time).getTime();
        if (ms >= a && ms <= b) {
          const f = (ms - a) / (b - a || 1);
          return xForIdx(i, n) + (xForIdx(i + 1, n) - xForIdx(i, n)) * f;
        }
      }
      return PLOT_RIGHT;
    };
    const markers = [];
    const seen = new Set();
    for (let i = 0; i < n; i++) {
      const t = new Date(hours[i].time);
      const key = `${t.getFullYear()}-${t.getMonth()}-${t.getDate()}`;
      if (seen.has(key)) continue;
      seen.add(key);
      const sun = sunTimes(t, LAT_WIND);
      const midHour = (sun.sunsetHr > sun.sunriseHr)
        ? (sun.sunriseHr + sun.sunsetHr) / 2
        : 12;
      const midnight = new Date(t.getFullYear(), t.getMonth(), t.getDate()).getTime();
      markers.push({ x: xAt(midnight + midHour * 3600000) });
    }
    return markers;
  }, [hours, n]);

  const { nightRuns, sunLines } = useMemo(() => {
    if (!n) return { nightRuns: [], sunLines: [] };
    const xAt = (ms) => {
      const firstMs = new Date(hours[0].time).getTime();
      const lastMs = new Date(hours[n - 1].time).getTime();
      if (ms <= firstMs) return PLOT_LEFT;
      if (ms >= lastMs) return PLOT_RIGHT;
      for (let i = 0; i < n - 1; i++) {
        const a = new Date(hours[i].time).getTime();
        const b = new Date(hours[i + 1].time).getTime();
        if (ms >= a && ms <= b) {
          const f = (ms - a) / (b - a || 1);
          return xForIdx(i, n) + (xForIdx(i + 1, n) - xForIdx(i, n)) * f;
        }
      }
      return PLOT_RIGHT;
    };
    const dayMap = new Map();
    const night = [];
    const lines = [];
    for (let i = 0; i < n; i++) {
      const t = new Date(hours[i].time);
      const key = `${t.getFullYear()}-${t.getMonth()}-${t.getDate()}`;
      let sun = dayMap.get(key);
      if (!sun) {
        sun = sunTimes(t, LAT_WIND);
        dayMap.set(key, sun);
        const midnight = new Date(t.getFullYear(), t.getMonth(), t.getDate()).getTime();
        lines.push({ x: xAt(midnight + sun.sunriseHr * 3600000) });
        lines.push({ x: xAt(midnight + sun.sunsetHr * 3600000) });
      }
      const hr = t.getHours() + t.getMinutes() / 60;
      night.push(hr < sun.sunriseHr || hr >= sun.sunsetHr);
    }
    const xStartFor = (i) => i === 0 ? PLOT_LEFT : (xForIdx(i - 1, n) + xForIdx(i, n)) / 2;
    const xEndFor = (i) => i === n - 1 ? PLOT_RIGHT : (xForIdx(i, n) + xForIdx(i + 1, n)) / 2;
    const runs = [];
    let start = null;
    for (let i = 0; i < n; i++) {
      if (night[i] && start === null) start = i;
      if ((!night[i] || i === n - 1) && start !== null) {
        const end = night[i] && i === n - 1 ? i : i - 1;
        runs.push({ x: xStartFor(start), w: xEndFor(end) - xStartFor(start) });
        start = null;
      }
    }
    return { nightRuns: runs, sunLines: lines };
  }, [hours, n]);

  const yTicks = [0, 2, 4, 6, 8, 10, 12, 14];

  const idxFromClientX = (clientX, rect) => {
    const vbX = ((clientX - rect.left) / rect.width) * 800;
    if (vbX < PLOT_LEFT || vbX > PLOT_RIGHT) return null;
    const frac = (vbX - PLOT_LEFT) / PLOT_WIDTH;
    return Math.max(0, Math.min(n - 1, Math.round(frac * (n - 1))));
  };

  const handleMove = (e) => {
    const rect = e.currentTarget.getBoundingClientRect();
    const i = idxFromClientX(e.clientX, rect);
    if (i == null) { onHover(null); return; }
    onHover(i);
  };

  const handleTouch = (e) => {
    const touch = e.touches[0];
    if (!touch) return;
    const rect = e.currentTarget.getBoundingClientRect();
    const i = idxFromClientX(touch.clientX, rect);
    if (i == null) return;
    onHover(i);
  };

  const hovered = hoveredIdx != null && hoveredIdx >= 0 && hoveredIdx < n
    ? { x: xForIdx(hoveredIdx, n), y: yForFt(hours[hoveredIdx].waveFt) }
    : null;

  const wrapStyle = {
    position: 'relative',
    touchAction: IS_MOBILE ? 'none' : undefined,
  };

  return (
    <div className="fn-chart-wrap" ref={wrapRef} style={wrapStyle}>
      <svg viewBox="0 0 800 270" preserveAspectRatio="xMidYMid meet"
           onMouseMove={handleMove}
           onMouseLeave={() => { if (!IS_MOBILE) onHover(null); }}
           onTouchStart={handleTouch}
           onTouchMove={handleTouch}
           onTouchEnd={() => onHover(null)}
           onTouchCancel={() => onHover(null)}>
        <rect x={PLOT_LEFT} y={PLOT_TOP}
              width={PLOT_WIDTH} height={PLOT_HEIGHT}
              fill="#0a0c18" />

        {yTicks.map(ft => (
          <g key={'yt-' + ft}>
            <line x1={PLOT_LEFT} x2={PLOT_RIGHT}
                  y1={yForFt(ft)} y2={yForFt(ft)}
                  stroke="#1a1d33" strokeWidth="1" />
            <text x={PLOT_LEFT - 6} y={yForFt(ft) + 4}
                  fontFamily="Noto Sans, sans-serif"
                  fontSize="10" fill="#8a90a8" textAnchor="end">
              {ft} ft
            </text>
          </g>
        ))}

        {nightRuns.map((run, i) => (
          <rect key={'night-' + i}
                x={run.x} y={PLOT_TOP}
                width={run.w} height={PLOT_HEIGHT}
                fill="rgba(2,3,14,0.58)" />
        ))}

        {sunMarkers.map((m, i) => (
          <g key={'sun-icon-' + i} transform={`translate(${m.x.toFixed(2)}, ${(PLOT_TOP + 32)})`}>
            <circle r="4.5" fill="#fde047" stroke="#facc15" strokeWidth="0.5" />
            <g stroke="#fde047" strokeWidth="1.3" strokeLinecap="round">
              <line x1="0" y1="-7" x2="0" y2="-9.5" />
              <line x1="0" y1="7" x2="0" y2="9.5" />
              <line x1="-7" y1="0" x2="-9.5" y2="0" />
              <line x1="7" y1="0" x2="9.5" y2="0" />
              <line x1="-5" y1="-5" x2="-6.9" y2="-6.9" />
              <line x1="5" y1="-5" x2="6.9" y2="-6.9" />
              <line x1="-5" y1="5" x2="-6.9" y2="6.9" />
              <line x1="5" y1="5" x2="6.9" y2="6.9" />
            </g>
          </g>
        ))}

        {areaSegments.map((seg, i) => (
          <path key={'area-' + i} d={seg.d}
                fill={seg.color} fillOpacity="0.55" stroke="none" />
        ))}

        <path d={linePath} fill="none"
              stroke="#e6e8f2" strokeWidth="1.5"
              strokeLinejoin="round" strokeLinecap="round" />

        {sunLines.map((sl, i) => (
          <line key={'sunline-' + i}
                x1={sl.x} x2={sl.x}
                y1={PLOT_TOP} y2={PLOT_BOTTOM}
                stroke="#f5c518" strokeOpacity="0.22"
                strokeWidth="1" strokeDasharray="3 3" />
        ))}

        {dayDividers.map((dv, i) => (
          <g key={'dv-' + i}>
            <line x1={dv.x} x2={dv.x}
                  y1={PLOT_TOP} y2={PLOT_BOTTOM}
                  stroke="#f5c518" strokeOpacity="0.18"
                  strokeWidth="1" strokeDasharray="3 3" />
            <text x={dv.labelX} y={PLOT_TOP + 12}
                  fontFamily="Noto Sans, sans-serif"
                  fontSize="11" fontWeight="600"
                  fill="#cfd3e6" textAnchor="middle">
              {dv.label}
            </text>
          </g>
        ))}

        {hovered && (
          <g pointerEvents="none">
            <line x1={hovered.x} x2={hovered.x}
                  y1={PLOT_TOP} y2={PLOT_BOTTOM}
                  stroke="#f5c518" strokeOpacity="0.55"
                  strokeWidth="1" />
            <circle cx={hovered.x} cy={hovered.y} r="4"
                    fill="#f5c518" stroke="#0a0c18" strokeWidth="1.5" />
          </g>
        )}
      </svg>
      {IS_MOBILE ? (
        <MobileHoverBanner hours={hours} hoveredIdx={hoveredIdx} wrapWidth={wrapWidth} />
      ) : (
        <>
          <Tooltip hours={hours} hoveredIdx={hoveredIdx} wrapWidth={wrapWidth} />
          <HoverBanner hours={hours} hoveredIdx={hoveredIdx} wrapWidth={wrapWidth} />
        </>
      )}
    </div>
  );
}

const ARROW_COLORS = {
  offshore: '#22c55e',
  onshore: '#ef4444',
  crossshore: '#fb923c',
  swell: '#67e8f9',
  wind: '#fde047',
};

function classifyWind(windFromDeg) {
  if (windFromDeg == null) return 'crossshore';
  const to = (((windFromDeg + 180) % 360) + 360) % 360;
  if (to >= 110 && to <= 200) return 'offshore';
  if ((to >= 290 && to <= 360) || (to >= 0 && to <= 20)) return 'onshore';
  return 'crossshore';
}

// Arrow length tuning (image viewBox is 100x100 units = percent of image width)
const ARROW_MIN_LEN = 10;   // 10% of image width
const ARROW_MAX_LEN = 35;   // 35% of image width
const K_WIND  = 22 / 15;                  // 15 mph → ~22% of image width
const K_SWELL = 22 / Math.sqrt(4 * 4 * 11); // 4ft @ 11s (sqrt(energy)≈13.27) → ~22% of image width

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function LineupOverlay({ hours, hoveredIdx }) {
  const [imgFailed, setImgFailed] = useState(false);

  const activeIdx = hoveredIdx != null && hours[hoveredIdx] ? hoveredIdx : 0;
  const h = hours[activeIdx] || {};

  const windColor = ARROW_COLORS.wind;
  const swellColor = ARROW_COLORS.swell;

  // Arrow lengths
  const windLen = h.windMph != null
    ? clamp(h.windMph * K_WIND, ARROW_MIN_LEN, ARROW_MAX_LEN)
    : ARROW_MIN_LEN;
  const swellEnergy = (h.waveFt != null && h.period != null)
    ? h.waveFt * h.waveFt * h.period
    : 0;
  const swellLen = swellEnergy > 0
    ? clamp(Math.sqrt(swellEnergy) * K_SWELL, ARROW_MIN_LEN, ARROW_MAX_LEN)
    : ARROW_MIN_LEN;

  // Secondary swell threshold: suppress nulls, tiny heights, and near-duplicate
  // partitions the model sometimes emits at almost the same direction as primary.
  const sHeight = h.secondarySwellHeight;
  const sPeriod = h.secondarySwellPeriod;
  const sDir    = h.secondarySwellDirection;
  const showSecondary = sHeight != null
    && sPeriod != null
    && sDir != null
    && sHeight >= 1
    && (h.waveFt == null || sHeight >= 0.25 * h.waveFt);
  const secondaryEnergy = showSecondary ? sHeight * sHeight * sPeriod : 0;
  const secondaryLen = showSecondary
    ? clamp(Math.sqrt(secondaryEnergy) * K_SWELL, ARROW_MIN_LEN, ARROW_MAX_LEN)
    : ARROW_MIN_LEN;
  const secondaryOpacityMod = (showSecondary && swellEnergy > 0)
    ? Math.min(1, Math.sqrt(secondaryEnergy) / Math.sqrt(swellEnergy))
    : 1;
  const secondaryOpacity = 0.55 * secondaryOpacityMod;

  // Firing: wind offshore (windToDeg in [110,200]) AND at least one swell train in-window
  const windToDeg = h.windDir != null
    ? (((h.windDir + 180) % 360) + 360) % 360
    : null;
  const windOffshore = windToDeg != null && windToDeg >= 110 && windToDeg <= 200;
  const primarySwellInWindow = h.swellDir != null
    && h.swellDir >= SWELL_WINDOW_MIN
    && h.swellDir <= SWELL_WINDOW_MAX;
  const secondarySwellInWindow = showSecondary
    && sDir >= SWELL_WINDOW_MIN
    && sDir <= SWELL_WINDOW_MAX;
  const firing = windOffshore && (primarySwellInWindow || secondarySwellInWindow);

  // Reef heading dashed guide
  const reefRad = (REEF_HEADING_DEG * Math.PI) / 180;
  const reefLen = 15; // ~15% of image width
  const reefEndX = 50 + reefLen * Math.sin(reefRad);
  const reefEndY = 50 - reefLen * Math.cos(reefRad);
  const reefLabelX = 50 + (reefLen + 5) * Math.sin(reefRad);
  const reefLabelY = 50 - (reefLen + 5) * Math.cos(reefRad);

  // Swell window cone
  const coneRadius = 40;
  const coneMinRad = (SWELL_WINDOW_MIN * Math.PI) / 180;
  const coneMaxRad = (SWELL_WINDOW_MAX * Math.PI) / 180;
  const coneX1 = 50 + coneRadius * Math.sin(coneMinRad);
  const coneY1 = 50 - coneRadius * Math.cos(coneMinRad);
  const coneX2 = 50 + coneRadius * Math.sin(coneMaxRad);
  const coneY2 = 50 - coneRadius * Math.cos(coneMaxRad);
  const conePath = `M 50 50 L ${coneX1.toFixed(2)} ${coneY1.toFixed(2)} `
    + `A ${coneRadius} ${coneRadius} 0 0 1 ${coneX2.toFixed(2)} ${coneY2.toFixed(2)} Z`;

  // Shadow / glow (firing stacks green glow on top of base shadow). The glow
  // attaches only to arrow(s) whose own swell train is in-window; the wind arrow
  // tracks the overall firing predicate.
  const baseShadow = 'drop-shadow(0 1px 2px rgba(0,0,0,0.6))';
  const firingShadow = 'drop-shadow(0 0 6px rgba(34, 197, 94, 0.9)) ' + baseShadow;
  const primaryArrowFilter   = (firing && primarySwellInWindow)   ? firingShadow : baseShadow;
  const secondaryArrowFilter = (firing && secondarySwellInWindow) ? firingShadow : baseShadow;
  const windArrowFilter      = firing                              ? firingShadow : baseShadow;

  const reefStroke = firing ? 'rgba(255,255,255,0.7)' : 'rgba(255,255,255,0.3)';
  const coneFill = firing ? 'rgba(34, 197, 94, 0.2)' : 'rgba(103, 232, 249, 0.15)';

  const windCompass = degToCompass(h.windDir) || '–';
  const windMphText = h.windMph != null ? Math.round(h.windMph) : '–';
  const windLabel = `${windMphText}mph ${windCompass}`;

  const swellCompass = degToCompass(h.swellDir) || '–';
  const swellFtText = h.waveFt != null ? h.waveFt.toFixed(1) : '–';
  const swellPerText = h.period != null ? h.period.toFixed(0) + 's' : '–';
  const swellLabel = `${swellFtText}ft @ ${swellPerText} ${swellCompass}`;

  const secondaryCompass = degToCompass(sDir) || '–';
  const secondaryFtText = sHeight != null ? sHeight.toFixed(1) : '–';
  const secondaryPerText = sPeriod != null ? sPeriod.toFixed(0) + 's' : '–';
  const secondaryLabel = `${secondaryFtText}ft @ ${secondaryPerText} ${secondaryCompass}`;

  return (
    <div className="fn-lineup">
      <SectionHeader
        title="Satellite Map"
        pill="Lineup"
        sub="Chocomount Beach"
      />
      <div className="fn-lineup-frame">
        {imgFailed ? (
          <div className="fn-lineup-placeholder">Lineup view unavailable</div>
        ) : (
          <img
            className="fn-lineup-img"
            src="assets/lineup.jpg"
            alt="Lineup satellite view"
            onError={() => setImgFailed(true)}
          />
        )}

        <div className="fn-lineup-overlay">
          <svg
            viewBox="0 0 100 100"
            preserveAspectRatio="xMidYMid meet"
            style={{
              position: 'absolute',
              inset: 0,
              width: '100%',
              height: '100%',
              pointerEvents: 'none',
              overflow: 'visible',
            }}
          >
            <path
              d={conePath}
              fill={coneFill}
              stroke="none"
              style={{ transition: 'fill 200ms' }}
            />

            <line
              x1="50" y1="50"
              x2={reefEndX.toFixed(2)} y2={reefEndY.toFixed(2)}
              stroke={reefStroke}
              strokeWidth="0.6"
              strokeDasharray="2 2"
              style={{ transition: 'stroke 200ms' }}
            />
            <text
              x={reefLabelX.toFixed(2)} y={reefLabelY.toFixed(2)}
              fontSize="3"
              fill="rgba(255,255,255,0.5)"
              fontFamily="Noto Sans, sans-serif"
              textAnchor="middle"
              dominantBaseline="middle"
            >reef 335°</text>

            {showSecondary && (
              <ConvergingArrow
                fromDeg={sDir}
                length={secondaryLen}
                color={swellColor}
                filter={secondaryArrowFilter}
                label={secondaryLabel}
                opacity={secondaryOpacity}
                fontSize={2.17}
              />
            )}
            <ConvergingArrow
              fromDeg={h.swellDir}
              length={swellLen}
              color={swellColor}
              filter={primaryArrowFilter}
              label={swellLabel}
            />
            <ConvergingArrow
              fromDeg={h.windDir}
              length={windLen}
              color={windColor}
              filter={windArrowFilter}
              label={windLabel}
            />
          </svg>
        </div>
      </div>
      <div className="fn-lineup-legend" aria-label="Arrow legend">
        <span className="fn-lineup-legend-item" style={{ color: swellColor }}>
          <span className="fn-lineup-legend-swatch"
                style={{ background: swellColor }}></span>
          <span style={{ color: '#cfd3e6' }}>Swell direction</span>
        </span>
        <span className="fn-lineup-legend-item" style={{ color: windColor }}>
          <span className="fn-lineup-legend-swatch"
                style={{ background: windColor }}></span>
          <span style={{ color: '#cfd3e6' }}>Wind direction</span>
        </span>
      </div>
      <Sources links={MAP_SOURCES} />
    </div>
  );
}

// Renders an arrow with tip (head) at the apex (50,50) and shaft extending
// outward toward the "from" direction, drawn directly in world coordinates.
// fromDeg = compass bearing (0°=N, clockwise) the wind/swell is coming FROM.
function ConvergingArrow({ fromDeg, length, color, filter, label, opacity = 1, fontSize = 2.6 }) {
  if (fromDeg == null) return null;
  const rad = (((fromDeg % 360) + 360) % 360) * Math.PI / 180;
  const ux = Math.sin(rad);       // forward (apex → origin) unit x
  const uy = -Math.cos(rad);      // forward unit y (screen y inverted)
  const px = Math.cos(rad);       // perpendicular (90° CW of forward) x
  const py = Math.sin(rad);       // perpendicular y

  const HEAD_LEN = 5;
  const HEAD_HALF_W = 3;
  const originX = 50 + length * ux;
  const originY = 50 + length * uy;
  const headBaseX = 50 + HEAD_LEN * ux;
  const headBaseY = 50 + HEAD_LEN * uy;
  const cornerLX = headBaseX - HEAD_HALF_W * px;
  const cornerLY = headBaseY - HEAD_HALF_W * py;
  const cornerRX = headBaseX + HEAD_HALF_W * px;
  const cornerRY = headBaseY + HEAD_HALF_W * py;

  return (
    <g style={{ filter, transition: 'filter 200ms' }} opacity={opacity}>
      <line
        x1={headBaseX.toFixed(2)} y1={headBaseY.toFixed(2)}
        x2={originX.toFixed(2)} y2={originY.toFixed(2)}
        stroke={color} strokeWidth="2"
        strokeLinecap="round"
      />
      <polygon
        points={`50,50 ${cornerLX.toFixed(2)},${cornerLY.toFixed(2)} ${cornerRX.toFixed(2)},${cornerRY.toFixed(2)}`}
        fill={color}
      />
      <ArrowLabel
        originX={originX} originY={originY}
        perpX={px} perpY={py}
        color={color} text={label}
        fontSize={fontSize}
      />
    </g>
  );
}

// Axis-aligned upright label pill anchored at arrow origin, offset
// perpendicular to the shaft so it doesn't overlap the line. Styled to
// match the "LIVE" pill — white chip with dark text, small border-radius.
function ArrowLabel({ originX, originY, perpX, perpY, color, text, fontSize = 2.6 }) {
  const OFFSET = 1.8;
  const PAD_X = 1.4;
  const PAD_Y = 0.7;
  const charW = fontSize * (1.35 / 2.6);
  const w = Math.max(6, text.length * charW + PAD_X * 2);
  const h = fontSize + PAD_Y * 2;
  const cx = originX + (OFFSET + w / 2) * perpX;
  const cy = originY + (OFFSET + w / 2) * perpY;
  return (
    <g>
      <rect
        x={(cx - w / 2).toFixed(2)}
        y={(cy - h / 2).toFixed(2)}
        width={w.toFixed(2)}
        height={h.toFixed(2)}
        rx="0.9" ry="0.9"
        fill="#ffffff"
        stroke={color}
        strokeWidth="0.25"
      />
      <text
        x={cx.toFixed(2)} y={cy.toFixed(2)}
        fontSize={fontSize}
        fill="#0a0c18"
        fontFamily="Noto Sans, sans-serif"
        fontWeight="700"
        letterSpacing="0.04em"
        textAnchor="middle"
        dominantBaseline="middle"
      >{text}</text>
    </g>
  );
}

// ── LIVE spectral rose ───────────────────────────
// Ported from app.js (drawCompassRose, parseNDBCSpectral, periodColorRGBA,
// fetchTextWithProxies). Stripped of chart-scrub hooks — this panel shows
// LIVE buoy observations only and has its own time axis.

async function fetchNdbcText(rawUrl, timeout = 15000) {
  for (const proxy of NDBC_PROXIES) {
    const url = proxy.encode
      ? proxy.prefix + encodeURIComponent(rawUrl)
      : proxy.prefix + rawUrl;
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeout);
    try {
      const resp = await fetch(url, { signal: controller.signal });
      clearTimeout(timer);
      if (resp.ok) return await resp.text();
    } catch (_) {
      clearTimeout(timer);
    }
  }
  return null;
}

async function fetchSpectralBundle(buoyId) {
  const base = NDBC_BASE + buoyId;
  const [dataSpec, swdir, swdir2, swr1, swr2] = await Promise.all([
    fetchNdbcText(base + '.data_spec'),
    fetchNdbcText(base + '.swdir'),
    fetchNdbcText(base + '.swdir2'),
    fetchNdbcText(base + '.swr1'),
    fetchNdbcText(base + '.swr2'),
  ]);
  if (!dataSpec) return null;
  return { dataSpec, swdir, swdir2, swr1, swr2 };
}

// NDBC realtime2 spectral file parser. Returns the top `maxRows` data rows
// (newest first, matching file order) as [{ ts, freqs, values }, …]. The
// first 5 fields of each row are YY MM DD hh mm; data_spec has an extra
// sep_freq scalar before the value/(freq) pairs, swdir/swdir2/swr1/swr2 don't.
function parseSpectralFileRows(text, hasSepFreq, maxRows) {
  if (!text) return [];
  const lines = text.trim().split('\n');
  if (lines.length < 2) return [];
  const out = [];
  const limit = Math.min(maxRows, lines.length - 1);
  for (let li = 1; li <= limit; li++) {
    const row = lines[li].trim().split(/\s+/);
    if (row.length < 5) continue;
    const yy = Number(row[0]), mm = Number(row[1]), dd = Number(row[2]);
    const hh = Number(row[3]), mn = Number(row[4]);
    if ([yy, mm, dd, hh, mn].some(n => !Number.isFinite(n))) continue;
    const ts = new Date(Date.UTC(yy, mm - 1, dd, hh, mn));
    let i = 5 + (hasSepFreq ? 1 : 0);
    const freqs = [], values = [];
    while (i + 1 < row.length) {
      const v = Number(row[i]);
      const f = Number(row[i + 1].replace(/[()]/g, ''));
      if (!Number.isFinite(v) || !Number.isFinite(f)) break;
      values.push(v);
      freqs.push(f);
      i += 2;
    }
    if (freqs.length) out.push({ ts, freqs, values });
  }
  return out;
}

// Build the full spectrum (bins with energy + directional moments) for the
// top `maxRows` readings. Aux files (swdir/swdir2/swr1/swr2) are matched to
// the energy file by timestamp so an irregular gap in one file doesn't desync
// the others. Returns [{ ts, freqs, bins }, …], newest first.
function parseSpectralHistory(bundle, maxRows) {
  if (!bundle || !bundle.dataSpec) return [];
  const energyRows = parseSpectralFileRows(bundle.dataSpec, true, maxRows);
  if (!energyRows.length) return [];
  const byTs = (rows) => {
    const m = new Map();
    for (const r of rows) m.set(r.ts.getTime(), r);
    return m;
  };
  const dir1Map = byTs(parseSpectralFileRows(bundle.swdir,  false, maxRows));
  const dir2Map = byTs(parseSpectralFileRows(bundle.swdir2, false, maxRows));
  const r1Map   = byTs(parseSpectralFileRows(bundle.swr1,   false, maxRows));
  const r2Map   = byTs(parseSpectralFileRows(bundle.swr2,   false, maxRows));
  return energyRows.map(er => {
    const key = er.ts.getTime();
    const d1 = dir1Map.get(key), d2 = dir2Map.get(key);
    const rr1 = r1Map.get(key),  rr2 = r2Map.get(key);
    const bins = er.freqs.map((f, i) => ({
      freq: f,
      period: f > 0 ? 1 / f : 0,
      energy: er.values[i] || 0,
      dir1: d1  && d1.values[i]  != null ? d1.values[i]  : 0,
      dir2: d2  && d2.values[i]  != null ? d2.values[i]  : 0,
      r1:   rr1 && rr1.values[i] != null ? rr1.values[i] : 0.5,
      r2:   rr2 && rr2.values[i] != null ? rr2.values[i] : 0.25,
    }));
    return { ts: er.ts, freqs: er.freqs, bins };
  });
}

const SPECTRAL_HISTORY_ROWS = 13;  // current + 12 prior readings (≈6h at 30m cadence)

// Period (s) → [R,G,B] ramp. Matches the palette used by the main app's rose.
const PERIOD_COLOR_STOPS = [
  [2,  [ 90, 127, 160]],   // steel blue (short / chop)
  [7,  [ 58, 125, 125]],   // teal
  [11, [ 58, 125,  86]],   // sage
  [16, [184, 122,  46]],   // burnt orange
  [22, [138,  58,  46]],   // deep rust (long-period groundswell)
];
function periodColorRGBA(period, alpha) {
  const stops = PERIOD_COLOR_STOPS;
  if (!(period > 0) || period <= stops[0][0]) {
    const c = stops[0][1];
    return `rgba(${c[0]},${c[1]},${c[2]},${alpha})`;
  }
  if (period >= stops[stops.length - 1][0]) {
    const c = stops[stops.length - 1][1];
    return `rgba(${c[0]},${c[1]},${c[2]},${alpha})`;
  }
  for (let i = 0; i < stops.length - 1; i++) {
    const [p0, c0] = stops[i];
    const [p1, c1] = stops[i + 1];
    if (period >= p0 && period <= p1) {
      const t = (period - p0) / (p1 - p0);
      const rr = Math.round(c0[0] + (c1[0] - c0[0]) * t);
      const gg = Math.round(c0[1] + (c1[1] - c0[1]) * t);
      const bb = Math.round(c0[2] + (c1[2] - c0[2]) * t);
      return `rgba(${rr},${gg},${bb},${alpha})`;
    }
  }
  return `rgba(128,128,128,${alpha})`;
}

function drawRoseOnCanvas(canvas, spectral) {
  if (!canvas) return;
  const container = canvas.parentElement;
  const dpr = window.devicePixelRatio || 1;
  const size = Math.min(
    container.clientWidth  || 260,
    container.clientHeight || 260,
    420
  );
  if (size <= 0) return;
  canvas.width  = size * dpr;
  canvas.height = size * dpr;
  canvas.style.width  = size + 'px';
  canvas.style.height = size + 'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.scale(dpr, dpr);

  const compact = size < 380;
  const padLabel = compact ? 10 : 14;
  const cx = size / 2, cy = size / 2;
  const r = size / 2 - (compact ? 22 : 30);

  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, size, size);

  [0.25, 0.5, 0.75, 1.0].forEach(frac => {
    ctx.strokeStyle = '#eae6e0';
    ctx.lineWidth = 0.5;
    ctx.beginPath();
    ctx.arc(cx, cy, frac * r, 0, Math.PI * 2);
    ctx.stroke();
  });

  // Numeric labels on each concentric ring, positioned along a radial
  // that avoids the N/E/S/W compass labels and the SE swell-window cone.
  // Radials show fraction of peak energy in the current reading.
  ctx.fillStyle = '#8a827a';
  ctx.font = (compact ? '8px' : '9px') + ' "Noto Sans", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const labelAngleRad = -Math.PI / 4; // ~NW (315°) — clear of swell window (SE)
  [0.25, 0.5, 0.75, 1.0].forEach(frac => {
    const lx = cx + Math.cos(labelAngleRad) * frac * r;
    const ly = cy + Math.sin(labelAngleRad) * frac * r;
    // white halo for legibility
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(lx - 11, ly - 6, 22, 12);
    ctx.fillStyle = '#5a5550';
    ctx.fillText(Math.round(frac * 100) + '%', lx, ly);
  });

  ctx.fillStyle = '#8a827a';
  ctx.font = (compact ? '9px' : '10px') + ' "Noto Sans", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('N', cx, cy - r - padLabel);
  ctx.fillText('S', cx, cy + r + padLabel);
  ctx.fillText('E', cx + r + padLabel + 2, cy);
  ctx.fillText('W', cx - r - padLabel - 2, cy);

  // Reef's SE swell-window wedge — direction swell must be coming FROM to hit the spot.
  const toRad = d => (d - 90) * Math.PI / 180;
  ctx.strokeStyle = '#3a7d56';
  ctx.lineWidth = 1;
  ctx.globalAlpha = 0.4;
  [SWELL_WINDOW_MIN, SWELL_WINDOW_MAX].forEach(deg => {
    const rad = toRad(deg);
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(rad) * r, cy + Math.sin(rad) * r);
    ctx.stroke();
  });
  ctx.fillStyle = '#3a7d56';
  ctx.globalAlpha = 0.06;
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.arc(cx, cy, r, toRad(SWELL_WINDOW_MIN), toRad(SWELL_WINDOW_MAX));
  ctx.closePath();
  ctx.fill();
  ctx.globalAlpha = 1;

  ctx.font = '8px "DM Mono", monospace';
  ctx.fillStyle = '#3a7d56';
  ctx.globalAlpha = 0.6;
  [SWELL_WINDOW_MIN, SWELL_WINDOW_MAX].forEach(deg => {
    const rad = toRad(deg);
    const lx = cx + Math.cos(rad) * (r + 8);
    const ly = cy + Math.sin(rad) * (r + 8);
    ctx.fillText(`${deg}°`, lx, ly);
  });
  const midDeg = (SWELL_WINDOW_MIN + SWELL_WINDOW_MAX) / 2;
  const midRad = toRad(midDeg);
  ctx.font = '7px "DM Mono", monospace';
  ctx.fillText('swell window', cx + Math.cos(midRad) * r * 0.55, cy + Math.sin(midRad) * r * 0.55);
  ctx.globalAlpha = 1;

  // Directional wedges: one per freq bin, radius = energy density (linear),
  // color = period, angular half-width = sqrt(2·(1−r1)) clamped.
  if (spectral && spectral.bins && spectral.bins.length) {
    const rMax = r * 0.95;
    const wedges = [];
    let maxE = 0;
    for (const b of spectral.bins) {
      if (!(b.energy > 0) || !(b.period > 0) || !Number.isFinite(b.dir1)) continue;
      if (b.energy > maxE) maxE = b.energy;
      wedges.push({
        period: b.period,
        dir: ((b.dir1 % 360) + 360) % 360,
        r1: Number.isFinite(b.r1) ? Math.max(0, Math.min(1, b.r1)) : null,
        e: b.energy,
      });
    }
    if (maxE > 0) {
      wedges.sort((a, b) => b.e - a.e);
      const ALPHA = 0.55;
      for (const w of wedges) {
        const rOuter = (w.e / maxE) * rMax;
        if (rOuter <= 0.5) continue;
        const halfDeg = w.r1 == null
          ? 6
          : Math.max(3, Math.min(25, Math.sqrt(2 * (1 - w.r1)) * (180 / Math.PI)));
        const startA = toRad(w.dir - halfDeg);
        const endA   = toRad(w.dir + halfDeg);
        ctx.fillStyle = periodColorRGBA(w.period, ALPHA);
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, rOuter, startA, endA);
        ctx.closePath();
        ctx.fill();
      }
    }
  }

  // Hs at center — derived from spectral m0.
  if (spectral && spectral.bins && spectral.bins.length) {
    let m0 = 0;
    const bins = spectral.bins;
    for (let i = 0; i < bins.length; i++) {
      const df = i < bins.length - 1
        ? Math.abs(bins[i + 1].freq - bins[i].freq)
        : (i > 0 ? Math.abs(bins[i].freq - bins[i - 1].freq) : 0.005);
      m0 += bins[i].energy * df;
    }
    if (m0 > 0) {
      const hsFt = (4 * Math.sqrt(m0) * 3.28084).toFixed(1);
      ctx.font = 'bold 14px "DM Mono", monospace';
      ctx.fillStyle = '#2c2825';
      ctx.fillText(`${hsFt} ft`, cx, cy);
      ctx.font = '8px "DM Mono", monospace';
      ctx.fillStyle = '#8a827a';
      ctx.fillText('Hs', cx, cy + 14);
    }
  }
}

function formatRelative(ms) {
  if (ms == null || !Number.isFinite(ms)) return '';
  const absMin = Math.round(Math.abs(ms) / 60000);
  if (absMin < 1) return 'just now';
  if (absMin < 60) return absMin + ' min ago';
  const hrs = absMin / 60;
  if (hrs < 24) return hrs.toFixed(hrs < 10 ? 1 : 0) + ' hr ago';
  return Math.round(hrs / 24) + ' d ago';
}

// Format a minute-offset (≥0) for display under the slider thumb / pill.
// 0 → "now", 30 → "-30m", 60 → "-1h", 90 → "-1.5h", etc.
function formatHistoryOffset(min) {
  const m = Math.max(0, Math.round(min));
  if (m < 1) return 'now';
  if (m < 60) return '-' + m + 'm';
  const h = m / 60;
  if (Math.abs(h - Math.round(h)) < 0.05) return '-' + Math.round(h) + 'h';
  return '-' + h.toFixed(1) + 'h';
}

// Compact absolute time label, e.g. "2:02 PM ET". The timezone fragment relies
// on `timeZoneName: 'short'` returning a localized abbreviation.
function formatAbsoluteClock(ts) {
  if (!ts) return '';
  return ts.toLocaleString('en-US', {
    hour: 'numeric', minute: '2-digit', timeZoneName: 'short',
  });
}

function LiveSpectralPanel() {
  // history is newest-first: history[0] is the latest reading, history[N-1] is
  // the oldest in the 6-hour window.
  const [history, setHistory] = useState([]);
  const [status, setStatus] = useState('loading'); // 'loading' | 'ok' | 'stale' | 'error'
  const [retryIn, setRetryIn] = useState(null);
  const [nowTick, setNowTick] = useState(Date.now());
  // Slider parking: null = follow latest (rightmost). Otherwise the absolute
  // timestamp the user is parked on. Stored by timestamp (not index) so a
  // background refresh that shifts the array doesn't yank the view.
  const [selectedTs, setSelectedTs] = useState(null);
  const [resetToast, setResetToast] = useState(false);
  const canvasRef = useRef(null);
  const attemptRef = useRef(0);
  const toastTimerRef = useRef(null);

  // Run the fetch + schedule the next attempt. Exponential backoff on failure
  // (2s, 4s, 8s, 16s, then hold at 16s), success → schedule next refresh in
  // SPECTRAL_REFRESH_MS.
  useEffect(() => {
    let alive = true;
    let timer = null;
    let countdown = null;

    const run = async () => {
      try {
        const bundle = await fetchSpectralBundle(SPECTRAL_BUOY_STATION);
        if (!alive) return;
        if (!bundle) throw new Error('buoy data unavailable');
        const rows = parseSpectralHistory(bundle, SPECTRAL_HISTORY_ROWS);
        if (!rows.length) throw new Error('parse returned no bins');
        attemptRef.current = 0;
        setHistory(rows);
        const age = Date.now() - rows[0].ts.getTime();
        setStatus(age > SPECTRAL_STALE_MS ? 'stale' : 'ok');
        setRetryIn(null);
        timer = setTimeout(run, SPECTRAL_REFRESH_MS);
      } catch (err) {
        if (!alive) return;
        const attempt = Math.min(attemptRef.current + 1, 4);
        attemptRef.current = attempt;
        const delay = Math.pow(2, attempt) * 1000; // 2s, 4s, 8s, 16s
        setStatus('error');
        setRetryIn(Math.round(delay / 1000));
        // 1-sec countdown for user feedback
        let remaining = Math.round(delay / 1000);
        countdown = setInterval(() => {
          remaining -= 1;
          if (!alive) { clearInterval(countdown); return; }
          setRetryIn(remaining > 0 ? remaining : null);
          if (remaining <= 0) clearInterval(countdown);
        }, 1000);
        timer = setTimeout(run, delay);
      }
    };

    run();
    return () => {
      alive = false;
      if (timer) clearTimeout(timer);
      if (countdown) clearInterval(countdown);
    };
  }, []);

  // Re-tick every 30s so "18 min ago" stays fresh without hammering the fetch.
  useEffect(() => {
    const t = setInterval(() => setNowTick(Date.now()), 30000);
    return () => clearInterval(t);
  }, []);

  // If a refresh shifted the parked timestamp out of the window, reset to
  // the latest reading and surface a brief toast. Runs on every history /
  // selection change; no-op when the parked timestamp is still present.
  useEffect(() => {
    if (selectedTs == null || !history.length) return;
    const target = selectedTs.getTime();
    if (history.some(r => r.ts.getTime() === target)) return;
    setSelectedTs(null);
    setResetToast(true);
    if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
    toastTimerRef.current = setTimeout(() => setResetToast(false), 4000);
  }, [history, selectedTs]);

  useEffect(() => () => {
    if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
  }, []);

  // Resolve which history row to render. selectedIdx is an index into history
  // (0 = newest). Falls back to 0 (latest) when the parked ts isn't present.
  const N = history.length;
  let selectedIdx = 0;
  if (selectedTs != null && N > 0) {
    const found = history.findIndex(h => h.ts.getTime() === selectedTs.getTime());
    if (found >= 0) selectedIdx = found;
  }
  const currentReading = N > 0 ? history[selectedIdx] : null;
  const latestReading = N > 0 ? history[0] : null;
  const isHistoricalView = selectedIdx > 0;
  const offsetMin = currentReading && latestReading
    ? Math.round((latestReading.ts.getTime() - currentReading.ts.getTime()) / 60000)
    : 0;

  // Redraw canvas whenever the selected reading changes, and on window resize.
  // Snap-render: no transitions so scrubbing reads as a clean trend.
  useEffect(() => {
    const redraw = () => drawRoseOnCanvas(canvasRef.current, currentReading);
    redraw();
    window.addEventListener('resize', redraw);
    return () => window.removeEventListener('resize', redraw);
  }, [currentReading]);

  const observedAt = latestReading ? latestReading.ts : null;
  const age = observedAt ? nowTick - observedAt.getTime() : null;
  const isStale = status === 'stale' || (age != null && age > SPECTRAL_STALE_MS);
  const hasData = !!latestReading;

  // Slider value convention: rightmost = now. We map sliderValue v → history
  // index (N-1) - v so v=N-1 picks history[0] (latest).
  const sliderMax = Math.max(0, N - 1);
  const sliderValue = sliderMax - selectedIdx;
  const onSliderInput = (e) => {
    const v = Number(e.target.value);
    const newIdx = sliderMax - v;
    if (newIdx <= 0) {
      setSelectedTs(null); // follow latest across future refreshes
    } else {
      setSelectedTs(history[newIdx].ts);
    }
  };
  const returnToNow = () => setSelectedTs(null);

  // Build per-tick metadata using actual buoy timestamps so irregular gaps
  // surface in the labels. Whole-hour ticks are bigger and labeled; half-hour
  // ticks are visually marked but unlabeled.
  const ticks = [];
  for (let v = 0; v <= sliderMax; v++) {
    const idx = sliderMax - v;
    const r = history[idx];
    const off = latestReading ? Math.round((latestReading.ts.getTime() - r.ts.getTime()) / 60000) : 0;
    const isHour = Math.abs(off - Math.round(off / 60) * 60) <= 5;
    ticks.push({
      v,
      pct: sliderMax === 0 ? 50 : (v / sliderMax) * 100,
      offsetMin: off,
      label: isHour ? formatHistoryOffset(off) : null,
      isMajor: isHour,
    });
  }

  let observedLine = null;
  if (observedAt) {
    const local = observedAt.toLocaleString('en-US', {
      month: 'short', day: '2-digit',
      hour: 'numeric', minute: '2-digit',
    });
    observedLine = (
      <div className="fn-rose-timestamp">
        <span>Observed {local}</span>
        <span className="fn-rose-rel">· {formatRelative(age)}</span>
      </div>
    );
  }

  let overlay = null;
  if (status === 'loading' && !hasData) {
    overlay = (
      <div className="fn-rose-overlay-msg">
        <div className="fn-rose-overlay-inner">Loading live buoy spectrum…</div>
      </div>
    );
  } else if (status === 'error' && !hasData) {
    overlay = (
      <div className="fn-rose-overlay-msg">
        <div className="fn-rose-overlay-inner">
          Buoy data unavailable.
          {retryIn != null ? ' Retrying in ' + retryIn + 's.' : ' Retrying…'}
        </div>
      </div>
    );
  } else if (isStale && hasData) {
    const lastStr = observedAt
      ? observedAt.toLocaleString('en-US', { month: 'short', day: '2-digit', hour: 'numeric', minute: '2-digit' })
      : '—';
    overlay = (
      <div className="fn-rose-overlay-msg">
        <div className="fn-rose-overlay-inner">
          Buoy data stale — last reading {lastStr}. Station may be offline for service.
        </div>
      </div>
    );
  }

  const badgeClass = 'fn-live-badge' + (isHistoricalView ? ' fn-live-badge-dim' : '');
  const badgeProps = isHistoricalView
    ? { onClick: returnToNow, title: 'Return to current reading', role: 'button', tabIndex: 0,
        onKeyDown: (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); returnToNow(); } } }
    : {};

  const offsetLabel = formatHistoryOffset(offsetMin);
  const absLabel = formatAbsoluteClock(currentReading && currentReading.ts);

  let disclaimer;
  if (isHistoricalView) {
    const histAbs = currentReading.ts.toLocaleString('en-US', {
      month: 'short', day: '2-digit', hour: 'numeric', minute: '2-digit', timeZoneName: 'short',
    });
