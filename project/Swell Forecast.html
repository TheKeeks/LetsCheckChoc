<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Swell Forecast — Chocomount Beach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,700;0,900;1,900&family=Noto+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #07080f;
    font-family: 'Noto Sans', system-ui, sans-serif;
    color: #e6e8f2;
    min-height: 100vh;
  }
  #root {
    display: flex;
    justify-content: center;
    padding: 48px 16px;
  }
  .fn-card {
    position: relative;
    width: 860px;
    max-width: 100%;
    background: #0f1120;
    border-top: 3px solid #f5c518;
    padding: 28px 32px 24px;
    clip-path: polygon(
      16px 0, calc(100% - 16px) 0, 100% 16px,
      100% calc(100% - 16px), calc(100% - 16px) 100%,
      16px 100%, 0 calc(100% - 16px), 0 16px
    );
    box-shadow: 0 12px 40px rgba(0,0,0,0.55);
  }
  .fn-card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 68px;
    background-image: repeating-linear-gradient(
      135deg,
      rgba(245,197,24,0.08) 0 10px,
      rgba(245,197,24,0) 10px 22px
    );
    pointer-events: none;
    z-index: 0;
  }
  .fn-header {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 18px;
  }
  .fn-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-style: italic;
    font-size: 25px;
    letter-spacing: 0.04em;
    color: #f5c518;
    text-transform: uppercase;
    line-height: 1;
  }
  .fn-subtitle {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 400;
    font-size: 14px;
    letter-spacing: 0.12em;
    color: #a9b0c7;
    text-transform: uppercase;
  }
  .fn-chart-wrap {
    position: relative;
    z-index: 1;
    background: #0a0c18;
    border: 1px solid #1a1d33;
    padding: 12px;
  }
  .fn-chart-wrap svg { display: block; width: 100%; height: auto; }
  .fn-legend {
    position: relative;
    z-index: 1;
    display: flex;
    gap: 22px;
    flex-wrap: wrap;
    margin-top: 14px;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #cfd3e6;
  }
  .fn-legend-item { display: inline-flex; align-items: center; gap: 8px; }
  .fn-legend-dot {
    width: 10px; height: 10px; border-radius: 50%;
    display: inline-block;
  }
  .fn-statusbar {
    position: relative;
    z-index: 1;
    margin-top: 12px;
    padding: 8px 10px;
    background: #0a0c18;
    border-left: 2px solid #f5c518;
    font-family: 'Noto Sans', sans-serif;
    font-size: 12px;
    color: #a9b0c7;
    min-height: 18px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .fn-status-badge {
    display: inline-block;
    padding: 2px 8px;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #0a0c18;
    border-radius: 2px;
  }
  .fn-status-key {
    color: #6c7091;
    text-transform: uppercase;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px;
    letter-spacing: 0.1em;
    margin-right: 4px;
  }
  .fn-status-val { color: #e6e8f2; font-weight: 600; }
  .fn-placeholder {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    color: #6c7091;
    text-align: center;
    padding: 24px 0;
  }
  .fn-sources {
    position: relative;
    z-index: 1;
    margin-top: 14px;
    padding-top: 10px;
    border-top: 1px solid rgba(245, 197, 24, 0.35);
  }
  .fn-sources-header {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    user-select: none;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #a9b0c7;
    padding: 2px 0;
  }
  .fn-sources-header:hover { color: #f5c518; }
  .fn-sources-caret {
    display: inline-block;
    color: #f5c518;
    font-size: 11px;
    line-height: 1;
  }
  .fn-sources-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 8px 0 2px;
  }
  .fn-sources-link {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: #a9b0c7;
    text-decoration: none;
  }
  .fn-sources-link:hover { color: #f5c518; }
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;

const OFFSHORE_CENTER = 340;
const LAT_MARINE = 41.089152, LON_MARINE = -71.721050;
const LAT_WIND   = 41.275693, LON_WIND   = -71.963310;

const QUALITY_COLORS = {
  good: '#57e649',
  fair: '#f5c518',
  poor: '#ff4747',
};

const LEGEND = [
  { label: 'Good',  color: QUALITY_COLORS.good },
  { label: 'Fair',  color: QUALITY_COLORS.fair },
  { label: 'Poor',  color: QUALITY_COLORS.poor },
];

const COMPASS = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
function degToCompass(deg) {
  if (deg == null) return '';
  const idx = Math.round(((deg % 360) + 360) % 360 / 22.5) % 16;
  return COMPASS[idx];
}

function angularDist(a, b) {
  return Math.abs(((a - b) % 360 + 540) % 360 - 180);
}

function windQ(dir) {
  const d = angularDist(dir, OFFSHORE_CENTER);
  if (d <= 45) return 'good';
  if (d <= 90) return 'fair';
  return 'poor';
}

async function fetchForecastData() {
  const marineUrl = 'https://marine-api.open-meteo.com/v1/marine'
    + '?latitude=' + LAT_MARINE
    + '&longitude=' + LON_MARINE
    + '&hourly=swell_wave_height,swell_wave_direction,swell_wave_period'
    + '&length_unit=imperial'
    + '&timezone=auto'
    + '&forecast_days=7';

  const windUrl = 'https://api.open-meteo.com/v1/forecast'
    + '?latitude=' + LAT_WIND
    + '&longitude=' + LON_WIND
    + '&hourly=wind_speed_10m,wind_direction_10m,wind_gusts_10m'
    + '&wind_speed_unit=mph'
    + '&timezone=auto'
    + '&forecast_days=7';

  const [marineRes, windRes] = await Promise.all([
    fetch(marineUrl),
    fetch(windUrl),
  ]);

  if (!marineRes.ok) {
    throw new Error('Marine API ' + marineRes.status + ' ' + marineRes.statusText);
  }
  if (!windRes.ok) {
    throw new Error('Wind API ' + windRes.status + ' ' + windRes.statusText);
  }

  const marine = await marineRes.json();
  const wind = await windRes.json();

  const mh = marine.hourly || {};
  const wh = wind.hourly || {};
  const times = mh.time || [];
  const count = Math.min(168, times.length);

  const hours = [];
  for (let i = 0; i < count; i++) {
    hours.push({
      time: times[i],
      waveFt:   mh.swell_wave_height ? mh.swell_wave_height[i] : null,
      period:   mh.swell_wave_period ? mh.swell_wave_period[i] : null,
      swellDir: mh.swell_wave_direction ? mh.swell_wave_direction[i] : null,
      windMph:  wh.wind_speed_10m ? wh.wind_speed_10m[i] : null,
      windDir:  wh.wind_direction_10m ? wh.wind_direction_10m[i] : null,
      gustMph:  wh.wind_gusts_10m ? wh.wind_gusts_10m[i] : null,
    });
  }
  return hours;
}

function CardShell({ children }) {
  return (
    <div className="fn-card">
      <div className="fn-header">
        <div className="fn-title">Swell Forecast</div>
        <div className="fn-subtitle">Chocomount Beach</div>
      </div>
      {children}
    </div>
  );
}

function LoadingCard() {
  return (
    <CardShell>
      <div className="fn-chart-wrap">
        <div className="fn-placeholder">Loading forecast…</div>
      </div>
    </CardShell>
  );
}

function ErrorCard({ message }) {
  return (
    <CardShell>
      <div className="fn-chart-wrap">
        <div className="fn-placeholder">Error: {message || 'unable to load forecast'}</div>
      </div>
    </CardShell>
  );
}

const PLOT_LEFT = 40;
const PLOT_RIGHT = 760;
const PLOT_TOP = 16;
const PLOT_BOTTOM = 260;
const PLOT_WIDTH = PLOT_RIGHT - PLOT_LEFT;
const PLOT_HEIGHT = PLOT_BOTTOM - PLOT_TOP;
const STRIP_TOP = PLOT_BOTTOM + 6;
const STRIP_HEIGHT = 22;
const Y_MAX = 14;

function xForIdx(i, n) {
  if (n <= 1) return PLOT_LEFT;
  return PLOT_LEFT + (i / (n - 1)) * PLOT_WIDTH;
}
function yForFt(ft) {
  const v = Math.max(0, Math.min(Y_MAX, ft || 0));
  return PLOT_BOTTOM - (v / Y_MAX) * PLOT_HEIGHT;
}

function sunTimes(date, lat) {
  const toRad = (d) => (d * Math.PI) / 180;
  const toDeg = (r) => (r * 180) / Math.PI;
  const norm360 = (v) => ((v % 360) + 360) % 360;
  const norm24 = (v) => ((v % 24) + 24) % 24;
  const y = date.getFullYear();
  const m = date.getMonth();
  const d = date.getDate();
  const day = Math.floor((Date.UTC(y, m, d) - Date.UTC(y, 0, 0)) / 86400000);
  const lngHour = LON_WIND / 15;
  const latRad = toRad(lat);
  const zenithCos = Math.cos(toRad(90.833));
  const calc = (isRise) => {
    const t = day + ((isRise ? 6 : 18) - lngHour) / 24;
    const M = 0.9856 * t - 3.289;
    let L = M + 1.916 * Math.sin(toRad(M)) + 0.02 * Math.sin(toRad(2 * M)) + 282.634;
    L = norm360(L);
    let RA = toDeg(Math.atan(0.91764 * Math.tan(toRad(L))));
    RA = norm360(RA);
    const Lquad = Math.floor(L / 90) * 90;
    const RAquad = Math.floor(RA / 90) * 90;
    RA = (RA + (Lquad - RAquad)) / 15;
    const sinDec = 0.39782 * Math.sin(toRad(L));
    const cosDec = Math.cos(Math.asin(sinDec));
    const cosH = (zenithCos - sinDec * Math.sin(latRad)) / (cosDec * Math.cos(latRad));
    if (cosH > 1) return 0;
    if (cosH < -1) return 12;
    let H = isRise ? 360 - toDeg(Math.acos(cosH)) : toDeg(Math.acos(cosH));
    H /= 15;
    const T = H + RA - 0.06571 * t - 6.622;
    const UT = norm24(T - lngHour);
    const tz = -new Date(y, m, d, 12, 0, 0, 0).getTimezoneOffset() / 60;
    return norm24(UT + tz);
  };
  return { sunriseHr: calc(true), sunsetHr: calc(false) };
}

function buildSmoothPath(points) {
  if (points.length === 0) return '';
  if (points.length === 1) return `M ${points[0].x} ${points[0].y}`;
  let d = `M ${points[0].x} ${points[0].y}`;
  for (let i = 0; i < points.length - 1; i++) {
    const p0 = points[i === 0 ? i : i - 1];
    const p1 = points[i];
    const p2 = points[i + 1];
    const p3 = points[i + 2] || p2;
    const c1x = p1.x + (p2.x - p0.x) / 6;
    const c1y = p1.y + (p2.y - p0.y) / 6;
    const c2x = p2.x - (p3.x - p1.x) / 6;
    const c2y = p2.y - (p3.y - p1.y) / 6;
    d += ` C ${c1x.toFixed(2)} ${c1y.toFixed(2)}, ${c2x.toFixed(2)} ${c2y.toFixed(2)}, ${p2.x.toFixed(2)} ${p2.y.toFixed(2)}`;
  }
  return d;
}

function Tooltip({ hours, hoveredIdx, wrapWidth }) {
  if (hoveredIdx == null || !hours[hoveredIdx] || !wrapWidth) return null;
  const h = hours[hoveredIdx];
  const n = hours.length;
  const color = QUALITY_COLORS[windQ(h.windDir)];
  const innerW = Math.max(0, wrapWidth - 24);
  const pxX = 12 + (xForIdx(hoveredIdx, n) / 800) * innerW;
  const W = 170;
  const leftPx = Math.max(8, Math.min(wrapWidth - W - 8, pxX - W / 2));
  const style = {
    position: 'absolute',
    left: leftPx + 'px',
    top: '14px',
    width: W + 'px',
    background: '#0f1120',
    borderLeft: '3px solid ' + color,
    clipPath: 'polygon(8px 0, calc(100% - 8px) 0, 100% 8px, 100% calc(100% - 8px), calc(100% - 8px) 100%, 8px 100%, 0 calc(100% - 8px), 0 8px)',
    padding: '10px 14px',
    fontFamily: 'Noto Sans, sans-serif',
    fontSize: '12px',
    color: '#e6e8f2',
    pointerEvents: 'none',
    zIndex: 2,
    boxShadow: '0 8px 22px rgba(0,0,0,0.55)',
  };
  const rot = h.swellDir != null ? h.swellDir : 0;
  return (
    <div style={style}>
      <div style={{ fontFamily: 'Barlow Condensed, sans-serif', fontWeight: 900, fontStyle: 'italic', fontSize: '24px', color: '#f5c518', lineHeight: 1 }}>
        {h.waveFt != null ? h.waveFt.toFixed(1) : '–'} ft
      </div>
      <div style={{ fontFamily: 'Barlow Condensed, sans-serif', fontSize: '13px', color: '#a9b0c7', letterSpacing: '0.08em', marginTop: '2px' }}>
        {h.period != null ? h.period.toFixed(0) + 's' : '–'}
      </div>
      <div style={{ display: 'flex', alignItems: 'center', gap: '6px', marginTop: '8px' }}>
        <svg width="14" height="14" viewBox="-7 -7 14 14" style={{ transform: 'rotate(' + rot + 'deg)' }}>
          <path d="M 0 -5 L 3 4 L 0 2 L -3 4 Z" fill="#cfd3e6" />
        </svg>
        <span style={{ color: '#cfd3e6' }}>{degToCompass(h.swellDir) || '–'}</span>
      </div>
      <div style={{ marginTop: '6px' }}>
        <span style={{ color: '#6c7091', fontFamily: 'Barlow Condensed, sans-serif', fontSize: '11px', letterSpacing: '0.1em' }}>WIND </span>
        {h.windMph != null ? Math.round(h.windMph) : '–'} mph
        {h.windDir != null ? ' ' + degToCompass(h.windDir) : ''}
      </div>
      <div>
        <span style={{ color: '#6c7091', fontFamily: 'Barlow Condensed, sans-serif', fontSize: '11px', letterSpacing: '0.1em' }}>GUST </span>
        {h.gustMph != null ? Math.round(h.gustMph) : '–'} mph
      </div>
    </div>
  );
}

function SwellChart({ hours, hoveredIdx, onHover }) {
  const n = hours.length;
  const wrapRef = useRef(null);
  const [wrapWidth, setWrapWidth] = useState(0);
  useEffect(() => {
    const update = () => {
      if (wrapRef.current) setWrapWidth(wrapRef.current.clientWidth);
    };
    update();
    window.addEventListener('resize', update);
    return () => window.removeEventListener('resize', update);
  }, []);
  const points = useMemo(
    () => hours.map((h, i) => ({ x: xForIdx(i, n), y: yForFt(h.waveFt) })),
    [hours, n]
  );

  const linePath = useMemo(() => buildSmoothPath(points), [points]);

  const areaSegments = useMemo(() => {
    const segs = [];
    if (points.length < 2) return segs;
    for (let i = 0; i < points.length - 1; i++) {
      const p1 = points[i];
      const p2 = points[i + 1];
      const p0 = points[i === 0 ? i : i - 1];
      const p3 = points[i + 2] || p2;
      const c1x = p1.x + (p2.x - p0.x) / 6;
      const c1y = p1.y + (p2.y - p0.y) / 6;
      const c2x = p2.x - (p3.x - p1.x) / 6;
      const c2y = p2.y - (p3.y - p1.y) / 6;
      const q = windQ(hours[i].windDir);
      const d =
        `M ${p1.x} ${PLOT_BOTTOM} ` +
        `L ${p1.x} ${p1.y} ` +
        `C ${c1x.toFixed(2)} ${c1y.toFixed(2)}, ${c2x.toFixed(2)} ${c2y.toFixed(2)}, ${p2.x.toFixed(2)} ${p2.y.toFixed(2)} ` +
        `L ${p2.x} ${PLOT_BOTTOM} Z`;
      segs.push({ d, color: QUALITY_COLORS[q] });
    }
    return segs;
  }, [points, hours]);

  const dayDividers = useMemo(() => {
    const divs = [];
    for (let i = 0; i < n; i++) {
      const t = new Date(hours[i].time);
      if (t.getHours() === 0 || i === 0) {
        const x = xForIdx(i, n);
        const label = t.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: '2-digit' })
          .toUpperCase()
          .replace(',', '')
          .replace(/\s+/, ' / ');
        divs.push({ x, label, i });
      }
    }
    return divs;
  }, [hours, n]);

  const { nightRuns, sunLines } = useMemo(() => {
    if (!n) return { nightRuns: [], sunLines: [] };
    const xAt = (ms) => {
      const firstMs = new Date(hours[0].time).getTime();
      const lastMs = new Date(hours[n - 1].time).getTime();
      if (ms <= firstMs) return PLOT_LEFT;
      if (ms >= lastMs) return PLOT_RIGHT;
      for (let i = 0; i < n - 1; i++) {
        const a = new Date(hours[i].time).getTime();
        const b = new Date(hours[i + 1].time).getTime();
        if (ms >= a && ms <= b) {
          const f = (ms - a) / (b - a || 1);
          return xForIdx(i, n) + (xForIdx(i + 1, n) - xForIdx(i, n)) * f;
        }
      }
      return PLOT_RIGHT;
    };
    const dayMap = new Map();
    const night = [];
    const lines = [];
    for (let i = 0; i < n; i++) {
      const t = new Date(hours[i].time);
      const key = `${t.getFullYear()}-${t.getMonth()}-${t.getDate()}`;
      let sun = dayMap.get(key);
      if (!sun) {
        sun = sunTimes(t, LAT_WIND);
        dayMap.set(key, sun);
        const midnight = new Date(t.getFullYear(), t.getMonth(), t.getDate()).getTime();
        lines.push({ x: xAt(midnight + sun.sunriseHr * 3600000) });
        lines.push({ x: xAt(midnight + sun.sunsetHr * 3600000) });
      }
      const hr = t.getHours() + t.getMinutes() / 60;
      night.push(hr < sun.sunriseHr || hr >= sun.sunsetHr);
    }
    const xStartFor = (i) => i === 0 ? PLOT_LEFT : (xForIdx(i - 1, n) + xForIdx(i, n)) / 2;
    const xEndFor = (i) => i === n - 1 ? PLOT_RIGHT : (xForIdx(i, n) + xForIdx(i + 1, n)) / 2;
    const runs = [];
    let start = null;
    for (let i = 0; i < n; i++) {
      if (night[i] && start === null) start = i;
      if ((!night[i] || i === n - 1) && start !== null) {
        const end = night[i] && i === n - 1 ? i : i - 1;
        runs.push({ x: xStartFor(start), w: xEndFor(end) - xStartFor(start) });
        start = null;
      }
    }
    return { nightRuns: runs, sunLines: lines };
  }, [hours, n]);

  const yTicks = [0, 2, 4, 6, 8, 10, 12, 14];

  const handleMove = (e) => {
    const svg = e.currentTarget;
    const rect = svg.getBoundingClientRect();
    const vbX = ((e.clientX - rect.left) / rect.width) * 800;
    if (vbX < PLOT_LEFT || vbX > PLOT_RIGHT) { onHover(null); return; }
    const frac = (vbX - PLOT_LEFT) / PLOT_WIDTH;
    const i = Math.max(0, Math.min(n - 1, Math.round(frac * (n - 1))));
    onHover(i);
  };

  const hovered = hoveredIdx != null && hoveredIdx >= 0 && hoveredIdx < n
    ? { x: xForIdx(hoveredIdx, n), y: yForFt(hours[hoveredIdx].waveFt) }
    : null;

  return (
    <div className="fn-chart-wrap" ref={wrapRef} style={{ position: 'relative' }}>
      <svg viewBox="0 0 800 300" preserveAspectRatio="xMidYMid meet"
           onMouseMove={handleMove}
           onMouseLeave={() => onHover(null)}>
        <defs>
          <mask id="crescentMask" maskContentUnits="objectBoundingBox">
            <circle cx="0.5" cy="0.5" r="0.5" fill="#fff" />
            <circle cx="0.72" cy="0.5" r="0.45" fill="#000" />
          </mask>
        </defs>
        <rect x={PLOT_LEFT} y={PLOT_TOP}
              width={PLOT_WIDTH} height={PLOT_HEIGHT}
              fill="#0a0c18" />

        {yTicks.map(ft => (
          <g key={'yt-' + ft}>
            <line x1={PLOT_LEFT} x2={PLOT_RIGHT}
                  y1={yForFt(ft)} y2={yForFt(ft)}
                  stroke="#1a1d33" strokeWidth="1" />
            <text x={PLOT_LEFT - 6} y={yForFt(ft) + 4}
                  fontFamily="Barlow Condensed, sans-serif"
                  fontSize="11" fill="#6c7091" textAnchor="end">
              {ft} FT
            </text>
          </g>
        ))}

        {nightRuns.map((run, i) => (
          <rect key={'night-' + i}
                x={run.x} y={PLOT_TOP}
                width={run.w} height={PLOT_HEIGHT}
                fill="rgba(2,3,14,0.58)" />
        ))}

        {nightRuns.map((run, i) => (
          <circle key={'moon-' + i}
                  cx={run.x + run.w / 2}
                  cy={(PLOT_TOP + PLOT_BOTTOM) / 2}
                  r="8"
                  fill="#f4f1e3"
                  mask="url(#crescentMask)" />
        ))}

        {areaSegments.map((seg, i) => (
          <path key={'area-' + i} d={seg.d}
                fill={seg.color} fillOpacity="0.18" stroke="none" />
        ))}

        <path d={linePath} fill="none"
              stroke="#e6e8f2" strokeWidth="1.5"
              strokeLinejoin="round" strokeLinecap="round" />

        {sunLines.map((sl, i) => (
          <line key={'sun-' + i}
                x1={sl.x} x2={sl.x}
                y1={PLOT_TOP} y2={PLOT_BOTTOM}
                stroke="#f5c518" strokeWidth="1"
                strokeDasharray="3 3" />
        ))}

        {dayDividers.map((dv, i) => (
          <g key={'dv-' + i}>
            <line x1={dv.x} x2={dv.x}
                  y1={PLOT_TOP} y2={PLOT_BOTTOM}
                  stroke="#f5c518" strokeOpacity="0.18"
                  strokeWidth="1" strokeDasharray="3 3" />
            <text x={dv.x + 4} y={PLOT_TOP + 12}
                  fontFamily="Barlow Condensed, sans-serif"
                  fontSize="10" fill="#cfa617"
                  letterSpacing="1">
              {dv.label}
            </text>
          </g>
        ))}

        <rect x={PLOT_LEFT} y={STRIP_TOP}
              width={PLOT_WIDTH} height={STRIP_HEIGHT}
              fill="#06080f" stroke="#1a1d33" strokeWidth="1" />
        {hours.map((h, i) => {
          const cellW = PLOT_WIDTH / n;
          const x = PLOT_LEFT + i * cellW;
          const q = windQ(h.windDir);
          return (
            <rect key={'q-' + i}
                  x={x} y={STRIP_TOP + 1}
                  width={cellW + 0.5} height={STRIP_HEIGHT - 2}
                  fill={QUALITY_COLORS[q]} fillOpacity="0.72" />
          );
        })}

        {hovered && (
          <g pointerEvents="none">
            <line x1={hovered.x} x2={hovered.x}
                  y1={PLOT_TOP} y2={STRIP_TOP + STRIP_HEIGHT}
                  stroke="#f5c518" strokeOpacity="0.55"
                  strokeWidth="1" />
            <circle cx={hovered.x} cy={hovered.y} r="4"
                    fill="#f5c518" stroke="#0a0c18" strokeWidth="1.5" />
          </g>
        )}
      </svg>
      <Tooltip hours={hours} hoveredIdx={hoveredIdx} wrapWidth={wrapWidth} />
    </div>
  );
}

function Legend() {
  return (
    <div className="fn-legend">
      {LEGEND.map(item => (
        <span key={item.label} className="fn-legend-item">
          <span className="fn-legend-dot" style={{ background: item.color }}></span>
          {item.label}
        </span>
      ))}
    </div>
  );
}

function StatusBar({ hours, hoveredIdx }) {
  if (hoveredIdx == null || !hours[hoveredIdx]) {
    return <div className="fn-statusbar">Hover the chart for details</div>;
  }
  const h = hours[hoveredIdx];
  const q = windQ(h.windDir);
  const color = QUALITY_COLORS[q];
  const t = new Date(h.time);
  const when = t.toLocaleString('en-US', {
    weekday: 'short', month: 'short', day: '2-digit',
    hour: 'numeric', minute: '2-digit',
  });
  return (
    <div className="fn-statusbar" style={{ borderLeftColor: color }}>
      <span>
        <span className="fn-status-key">When</span>
        <span className="fn-status-val">{when}</span>
      </span>
      <span>
        <span className="fn-status-key">Swell</span>
        <span className="fn-status-val">
          {h.waveFt != null ? h.waveFt.toFixed(1) : '–'} ft
          {h.period != null ? ' @ ' + h.period.toFixed(0) + 's' : ''}
        </span>
      </span>
      <span>
        <span className="fn-status-key">Wind</span>
        <span className="fn-status-val">
          {h.windMph != null ? Math.round(h.windMph) : '–'} mph
          {h.windDir != null ? ' ' + degToCompass(h.windDir) : ''}
          {h.gustMph != null ? ' (g ' + Math.round(h.gustMph) + ')' : ''}
        </span>
      </span>
      <span className="fn-status-badge" style={{ background: color }}>{q}</span>
    </div>
  );
}

function Sources() {
  const [expanded, setExpanded] = useState(false);
  return (
    <div className="fn-sources">
      <div
        className="fn-sources-header"
        role="button"
        tabIndex={0}
        aria-expanded={expanded}
        onClick={() => setExpanded(e => !e)}
        onKeyDown={(e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            setExpanded(v => !v);
          }
        }}
      >
        <span>Sources</span>
        <span className="fn-sources-caret">{expanded ? '▾' : '▸'}</span>
      </div>
      {expanded && (
        <div className="fn-sources-list">
          <a className="fn-sources-link"
             href="https://open-meteo.com/en/docs/marine-weather-api"
             target="_blank" rel="noopener noreferrer">
            Open-Meteo Marine API
          </a>
          <a className="fn-sources-link"
             href="https://open-meteo.com/en/docs"
             target="_blank" rel="noopener noreferrer">
            Open-Meteo Forecast API
          </a>
          <a className="fn-sources-link"
             href="https://gml.noaa.gov/grad/solcalc/"
             target="_blank" rel="noopener noreferrer">
            NOAA Solar Calculator
          </a>
        </div>
      )}
    </div>
  );
}

function App() {
  const [hours, setHours] = useState(null);
  const [error, setError] = useState(null);
  const [hoveredIdx, setHoveredIdx] = useState(null);

  useEffect(() => {
    let alive = true;
    fetchForecastData()
      .then(data => { if (alive) setHours(data); })
      .catch(err => { if (alive) setError(err.message || String(err)); });
    return () => { alive = false; };
  }, []);

  if (error) return <ErrorCard message={error} />;
  if (!hours) return <LoadingCard />;

  return (
    <CardShell>
      <SwellChart hours={hours} hoveredIdx={hoveredIdx} onHover={setHoveredIdx} />
      <Legend />
      <StatusBar hours={hours} hoveredIdx={hoveredIdx} />
      <Sources />
    </CardShell>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
