// ════════════════════════════════════════════════
// SURF-LOG REGRESSION MODEL — ported from app.js
// Three independent linear models (wave / ride / cond) trained per-user on
// logged sessions, used to score each forecast hour and to populate the
// forest-plot + scatter diagnostics. Mirrors app.js:3900–4170; kept in this
// file so the standalone page has no runtime dependency on the main app.
// ════════════════════════════════════════════════

const TIDE_STATION_ID = '8510719';
// Wind-offshore scoring constants — match app.js so weights mean the same thing
// here as in the main app.
const CHOC_OFFSHORE_CENTER = 337.5;
const OFFSHORE_HALF_WINDOW = 90;

const WAVE_FEATURE_NAMES = [
  'swell_height','swell_period','swell_dir_alignment','swell_dir_outside_deg',
  'period_x_alignment',
  'sec_swell_height','sec_swell_period','sec_dir_in_window'
];
const RIDE_FEATURE_NAMES = [
  'swell_dir_alignment','swell_dir_outside_deg','swell_period',
  'tide_height','time_to_low','low_incoming'
];
const COND_FEATURE_NAMES = [
  'wind_speed','wind_offshore_score'
];

let _TIDE_MEDIAN = 2.0;

function _windowGeometry() {
  const min = SWELL_WINDOW_MIN, max = SWELL_WINDOW_MAX;
  return { min, max, center: (min + max) / 2, half: (max - min) / 2 };
}
function _dirAlignment(dir, geo) { return Math.max(0, 1 - Math.abs(dir - geo.center) / geo.half); }
function _dirOutsideDeg(dir, geo) { return Math.min(45, Math.max(0, geo.min - dir, dir - geo.max)); }

function computeWindOffshoreScore(windDir) {
  if (windDir == null) return 0;
  return Math.round(Math.max(0, 1 - angularDist(windDir, CHOC_OFFSHORE_CENTER) / OFFSHORE_HALF_WINDOW) * 100) / 100;
}

function extractWaveFeatures(cond) {
  if (!cond || !cond.swell) return null;
  const s = cond.swell;
  const sec = s.secondary || { height: 0, direction: 0, period: 0 };
  const geo = _windowGeometry();
  const dir = s.direction || 0;
  const period = s.period || 0;
  const dirAlignment = _dirAlignment(dir, geo);
  const dirOutside = _dirOutsideDeg(dir, geo);
  const secDir = sec.direction || 0;
  const secInWindow = (secDir >= geo.min && secDir <= geo.max) ? 1 : 0;
  return [
    s.height || 0, period,
    dirAlignment, dirOutside,
    period * dirAlignment,
    sec.height || 0, sec.period || 0,
    secInWindow
  ];
}

function extractRideFeatures(cond) {
  if (!cond || !cond.swell) return null;
  const s = cond.swell;
  const t = cond.tide || { height: 0, stage: 'rising', timeToNearest: 0 };
  const geo = _windowGeometry();
  const dir = s.direction || 0;
  const dirAlignment = _dirAlignment(dir, geo);
  const dirOutside = _dirOutsideDeg(dir, geo);
  // Signed hours to low: rising → low just passed (negative); falling → low upcoming (positive).
  const timeToLow = t.stage === 'rising' ? -(t.timeToNearest || 0) : (t.timeToNearest || 0);
  const lowIncoming = ((t.height || 0) < _TIDE_MEDIAN && t.stage === 'rising') ? 1 : 0;
  return [
    dirAlignment, dirOutside, s.period || 0,
    t.height || 0, timeToLow, lowIncoming
  ];
}

function extractCondFeatures(cond) {
  const w = (cond && cond.wind) || { speed: 0 };
  // Forecast hours pre-attach wind_offshore_score via buildForecastCond, but
  // logged Firestore entries don't — fall back to computing from wind.direction
  // so the cond model trains on history instead of silently zeroing the feature.
  let offshore = (cond && cond.wind_offshore_score);
  if (offshore == null && w.direction != null) offshore = computeWindOffshoreScore(w.direction);
  return [
    w.speed || 0,
    offshore || 0
  ];
}

function matTranspose(A) {
  const r = A.length, c = A[0].length, T = [];
  for (let j = 0; j < c; j++) { T[j] = []; for (let i = 0; i < r; i++) T[j][i] = A[i][j]; }
  return T;
}
function matMul(A, B) {
  const rA = A.length, cA = A[0].length, cB = B[0].length;
  const C = Array.from({ length: rA }, () => new Array(cB).fill(0));
  for (let i = 0; i < rA; i++) for (let j = 0; j < cB; j++) for (let k = 0; k < cA; k++) C[i][j] += A[i][k] * B[k][j];
  return C;
}
function matInvert(m) {
  const n = m.length;
  const aug = m.map((r, i) => { const row = [...r]; for (let j = 0; j < n; j++) row.push(i === j ? 1 : 0); return row; });
  for (let c = 0; c < n; c++) {
    let mr = c;
    for (let r = c + 1; r < n; r++) if (Math.abs(aug[r][c]) > Math.abs(aug[mr][c])) mr = r;
    [aug[c], aug[mr]] = [aug[mr], aug[c]];
    if (Math.abs(aug[c][c]) < 1e-10) return null;
    const piv = aug[c][c];
    for (let j = 0; j < 2 * n; j++) aug[c][j] /= piv;
    for (let r = 0; r < n; r++) {
      if (r === c) continue;
      const f = aug[r][c];
      for (let j = 0; j < 2 * n; j++) aug[r][j] -= f * aug[c][j];
    }
  }
  return aug.map(r => r.slice(n));
}

function normalEquation(X, y) {
  const Xt = matTranspose(X), XtX = matMul(Xt, X);
  for (let i = 0; i < XtX.length; i++) XtX[i][i] += 0.001;
  const inv = matInvert(XtX); if (!inv) return null;
  return matMul(inv, matMul(Xt, y.map(v => [v]))).map(r => r[0]);
}

// Z-score normalization keeps weights stable across retrains.
function _trainOnArrays(X, y) {
  if (!X.length) return null;
  const nF = X[0].length;
  const stats = { mean: [], std: [] };
  for (let j = 0; j < nF; j++) {
    const col = X.map(r => r[j]);
    const mean = col.reduce((a, b) => a + b, 0) / col.length;
    const variance = col.reduce((a, b) => a + (b - mean) * (b - mean), 0) / col.length;
    stats.mean[j] = mean;
    stats.std[j] = Math.sqrt(variance);
  }
  const Xn = X.map(row => row.map((v, j) => stats.std[j] > 1e-10 ? (v - stats.mean[j]) / stats.std[j] : 0));
  const weights = normalEquation(Xn, y);
  return weights ? { weights, stats } : null;
}

function trainModel(entries, featureExtractor, targetFn) {
  const X = [], y = [];
  entries.forEach(e => { const f = featureExtractor(e.conditions); if (f) { X.push(f); y.push(targetFn(e)); } });
  if (!X.length) return { weights: null, stats: null, n: 0, minSamples: 12 };
  const nF = X[0].length;
  const minSamples = Math.max(2 * nF, 12);
  if (X.length < minSamples) return { weights: null, stats: null, n: X.length, minSamples };
  const trained = _trainOnArrays(X, y);
  if (!trained) return { weights: null, stats: null, n: X.length, minSamples };
  return { weights: trained.weights, stats: trained.stats, n: X.length, minSamples };
}

// Extended LOO. Returns held-out RMSE plus per-fold weight vectors (used for
// the forest-plot uncertainty bands) and per-session predictions (used for the
// calibration scatter — every dot is an out-of-sample point).
function leaveOneOutDetailed(entries, featureExtractor, targetFn) {
  const X = [], y = [], src = [];
  entries.forEach((e, idx) => {
    const f = featureExtractor(e.conditions);
    if (f) { X.push(f); y.push(targetFn(e)); src.push(idx); }
  });
  if (!X.length) return null;
  const nF = X[0].length;
  const minSamples = Math.max(2 * nF, 12);
  if (X.length < minSamples + 1) return null;
  let sse = 0, count = 0;
  const foldWeights = [], foldPreds = [], actuals = [], indices = [];
  for (let h = 0; h < X.length; h++) {
    const Xtr = X.slice(0, h).concat(X.slice(h + 1));
    const ytr = y.slice(0, h).concat(y.slice(h + 1));
    const m = _trainOnArrays(Xtr, ytr);
    if (!m) continue;
    let pred = 0;
    for (let j = 0; j < nF; j++) {
      const z = m.stats.std[j] > 1e-10 ? (X[h][j] - m.stats.mean[j]) / m.stats.std[j] : 0;
      pred += m.weights[j] * z;
    }
    const err = pred - y[h];
    sse += err * err; count++;
    foldWeights.push(m.weights);
    foldPreds.push(pred);
    actuals.push(y[h]);
    indices.push(src[h]);
  }
  return count
    ? { rmse: Math.sqrt(sse / count), foldWeights, foldPreds, actuals, indices, n: count }
    : null;
}

function _predict(ff, weights, stats) {
  if (!weights || !stats || !ff) return null;
  let pred = 0;
  for (let i = 0; i < ff.length; i++) {
    const sd = stats.std[i];
    pred += weights[i] * (sd > 1e-10 ? (ff[i] - stats.mean[i]) / sd : 0);
  }
  return Math.max(1, Math.min(10, Math.round(pred * 10) / 10));
}

// Tide H/L predictions for the forecast window — same CO-OPS endpoint app.js uses.
async function fetchTideHiLo(rangeDays = 7) {
  const now = new Date();
  const beginDate = [
    now.getFullYear(),
    String(now.getMonth() + 1).padStart(2, '0'),
    String(now.getDate()).padStart(2, '0')
  ].join('');
  const params = new URLSearchParams({
    begin_date: beginDate,
    range: String(rangeDays * 24),
    station: TIDE_STATION_ID,
    product: 'predictions',
    datum: 'MLLW',
    units: 'english',
    time_zone: 'lst_ldt',
    interval: 'hilo',
    application: 'letscheckchoc',
    format: 'json'
  });
  const res = await fetch('https://api.tidesandcurrents.noaa.gov/api/prod/datagetter?' + params);
  if (!res.ok) throw new Error('CO-OPS ' + res.status);
  const json = await res.json();
  return (json && json.predictions) ? json.predictions : [];
}

// Mirror of app.js parseTideAtTime: pick the nearest H/L pred, infer stage
// from whether that nearest is in the past or future, return signed hours.
function parseTideAtTime(predictions, dateStr) {
  if (!predictions || !predictions.length) return { height: 0, stage: 'rising', timeToNearest: 0 };
  const tt = new Date(dateStr).getTime();
  let ni = 0, nd = Infinity;
  for (let i = 0; i < predictions.length; i++) {
    const d = Math.abs(new Date(predictions[i].t).getTime() - tt);
    if (d < nd) { nd = d; ni = i; }
  }
  const n = predictions[ni], nt = new Date(n.t).getTime();
  const stage = nt > tt ? (n.type === 'H' ? 'rising' : 'falling') : (n.type === 'H' ? 'falling' : 'rising');
  return { height: parseFloat(n.v) || 0, stage, timeToNearest: Math.round(Math.abs(nt - tt) / 3600000 * 10) / 10 };
}

// Build the conditions object the extractors expect from a forecast hour.
function buildForecastCond(h, tideHiLo) {
  if (!h) return null;
  const swell = {
    height: h.waveFt || 0,
    direction: h.swellDir || 0,
    period: h.period || 0
  };
  const secH = h.secondarySwellHeight, secD = h.secondarySwellDirection, secP = h.secondarySwellPeriod;
  if (secH != null && secH > 0.3) {
    swell.secondary = { height: secH, direction: secD || 0, period: secP || 0 };
  }
  const tide = parseTideAtTime(tideHiLo, h.time);
  return {
    swell,
    wind: { speed: h.windMph || 0, direction: h.windDir || 0 },
    tide,
    wind_offshore_score: computeWindOffshoreScore(h.windDir)
  };
}

// Pull surf log entries from Firestore. Community log — all auth'd users see all.
async function loadLogsFromFirebase() {
  if (!window._fbFirestore) return [];
  if (!window._fbUserId || window._fbUserIsAnon) return [];
  const snap = await window._fbFirestore.collection('surf_logs')
    .orderBy('createdAt', 'desc')
    .limit(200)
    .get();
  return snap.docs.map(doc => {
    const d = doc.data();
    return {
      id: d.id,
      timestamp: d.timestamp,
      photos: (d.photos || []).filter(p => p && (p.url || typeof p === 'string')),
      ratings: d.ratings,
      notes: d.notes || '',
      conditions: d.conditions || null,
      userId: d.userId || '',
      displayName: d.displayName || ''
    };
  });
}

// Train all three models on the user's own sessions and return a bundle of
// weights, stats, LOO diagnostics, and the entries that fed training. Returned
// object is what gets stashed in App state and passed to the new cards.
function retrainAll(allEntries, uid) {
  const userScoped = uid ? allEntries.filter(e => e.userId === uid) : allEntries;
  const entries = userScoped.filter(e => e && e.conditions && e.conditions.swell && e.ratings);
  // Refresh tide median from logged tide heights so low_incoming tracks the user's history.
  const tideHeights = entries.map(e => e.conditions && e.conditions.tide && e.conditions.tide.height).filter(h => typeof h === 'number');
  if (tideHeights.length) {
    const sorted = [...tideHeights].sort((a, b) => a - b);
    const mid = Math.floor(sorted.length / 2);
    _TIDE_MEDIAN = sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
  }
  const wave = trainModel(entries, extractWaveFeatures, e => e.ratings.size);
  const ride = trainModel(entries, extractRideFeatures, e => e.ratings.rideQuality);
  const cond = trainModel(entries, extractCondFeatures, e => e.ratings.windQuality);
  const waveLOO = leaveOneOutDetailed(entries, extractWaveFeatures, e => e.ratings.size);
  const rideLOO = leaveOneOutDetailed(entries, extractRideFeatures, e => e.ratings.rideQuality);
  const condLOO = leaveOneOutDetailed(entries, extractCondFeatures, e => e.ratings.windQuality);
  return {
    entries,
    wave: { ...(wave || {}), loo: waveLOO, featureNames: WAVE_FEATURE_NAMES, target: 'size' },
    ride: { ...(ride || {}), loo: rideLOO, featureNames: RIDE_FEATURE_NAMES, target: 'rideQuality' },
    cond: { ...(cond || {}), loo: condLOO, featureNames: COND_FEATURE_NAMES, target: 'windQuality' }
  };
}

function _pairWeightsForLog(weights, names) {
  if (!weights) return null;
  const out = {};
  weights.forEach((w, i) => { out[names[i] || ('f' + i)] = Math.round(w * 1000) / 1000; });
  return out;
}
function logTrainSummary(bundle) {
  if (!bundle) return;
  console.groupCollapsed('[swell-forecast] surf-log model retrain — weights & validation');
  console.log('wave (target=size)', {
    n: bundle.wave.n, weights: _pairWeightsForLog(bundle.wave.weights, WAVE_FEATURE_NAMES),
    rmse_loo: bundle.wave.loo ? bundle.wave.loo.rmse : null
  });
  console.log('ride (target=rideQuality)', {
    n: bundle.ride.n, weights: _pairWeightsForLog(bundle.ride.weights, RIDE_FEATURE_NAMES),
    rmse_loo: bundle.ride.loo ? bundle.ride.loo.rmse : null
  });
  console.log('cond (target=windQuality)', {
    n: bundle.cond.n, weights: _pairWeightsForLog(bundle.cond.weights, COND_FEATURE_NAMES),
    rmse_loo: bundle.cond.loo ? bundle.cond.loo.rmse : null
  });
  console.groupEnd();
}

// ════════════════════════════════════════════════
// FORECAST MODEL CARDS — helpers shared by the three new cards
// ════════════════════════════════════════════════

// Per-hour score predictions from the trained bundle. Each series carries
// nulls where weights are missing or feature extraction returned null, so the
// cards can render the lines they have and skip the rest.
function computePredictionSeries(hours, bundle, tideHiLo) {
  const wave = [], ride = [], cond = [];
  if (!hours || !hours.length) return { wave, ride, cond };
  const haveWave = bundle && bundle.wave && bundle.wave.weights;
  const haveRide = bundle && bundle.ride && bundle.ride.weights;
  const haveCond = bundle && bundle.cond && bundle.cond.weights;
  for (let i = 0; i < hours.length; i++) {
    const c = buildForecastCond(hours[i], tideHiLo || []);
    wave.push(haveWave ? _predict(extractWaveFeatures(c), bundle.wave.weights, bundle.wave.stats) : null);
    ride.push(haveRide ? _predict(extractRideFeatures(c), bundle.ride.weights, bundle.ride.stats) : null);
    cond.push(haveCond ? _predict(extractCondFeatures(c), bundle.cond.weights, bundle.cond.stats) : null);
  }
  return { wave, ride, cond };
}

const SCORE_Y_MIN = 1, SCORE_Y_MAX = 10;
function yForScore(s) {
  if (s == null) return null;
  const v = Math.max(SCORE_Y_MIN, Math.min(SCORE_Y_MAX, s));
  return PLOT_BOTTOM - ((v - SCORE_Y_MIN) / (SCORE_Y_MAX - SCORE_Y_MIN)) * PLOT_HEIGHT;
}
// Map a 1-10 predicted score to the same wind-quality color buckets used
// elsewhere on the page so the line color tracks "good / fair / poor".
function scoreQ(s) {
  if (s == null) return 'poor';
  if (s >= 7) return 'good';
  if (s >= 5) return 'fair';
  return 'poor';
}

// Reusable hour-axis interpolator — mirrors SwellChart's inline xAt(). Extracted
// so the prediction timeline can place day dividers / sun markers without
// re-deriving the same closure.
function xAtMsForHours(ms, hours) {
  const n = hours.length;
  if (!n) return PLOT_LEFT;
  const firstMs = new Date(hours[0].time).getTime();
  const lastMs = new Date(hours[n - 1].time).getTime();
  if (ms <= firstMs) return PLOT_LEFT;
  if (ms >= lastMs) return PLOT_RIGHT;
  for (let i = 0; i < n - 1; i++) {
    const a = new Date(hours[i].time).getTime();
    const b = new Date(hours[i + 1].time).getTime();
    if (ms >= a && ms <= b) {
      const f = (ms - a) / (b - a || 1);
      return xForIdx(i, n) + (xForIdx(i + 1, n) - xForIdx(i, n)) * f;
    }
  }
  return PLOT_RIGHT;
}

// Same nightRuns / sunLines / dayDividers / sunMarkers SwellChart computes,
// but as a pure function so the prediction timeline can reuse the geometry
// without sharing state.
function computeTimelineGeometry(hours) {
  const n = hours.length;
  if (!n) return { dayDividers: [], sunMarkers: [], nightRuns: [], sunLines: [] };
  const dayMap = new Map();
  const sunMarkers = [];
  const dayDividers = [];
  const seen = new Set();
  for (let i = 0; i < n; i++) {
    const t = new Date(hours[i].time);
    const key = t.getFullYear() + '-' + t.getMonth() + '-' + t.getDate();
    if (!seen.has(key)) {
      seen.add(key);
      const sun = sunTimes(t, LAT_WIND);
      dayMap.set(key, sun);
      const midH = (sun.sunsetHr > sun.sunriseHr) ? (sun.sunriseHr + sun.sunsetHr) / 2 : 12;
      const midnight = new Date(t.getFullYear(), t.getMonth(), t.getDate()).getTime();
      sunMarkers.push({ x: xAtMsForHours(midnight + midH * 3600000, hours) });
    }
    if (t.getHours() === 0 || i === 0) {
      const sun = dayMap.get(key);
      const midH = (sun.sunsetHr > sun.sunriseHr) ? (sun.sunriseHr + sun.sunsetHr) / 2 : 12;
      const midnight = new Date(t.getFullYear(), t.getMonth(), t.getDate()).getTime();
      const label = t.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: '2-digit' }).replace(',', '');
      dayDividers.push({ x: xForIdx(i, n), label, labelX: xAtMsForHours(midnight + midH * 3600000, hours), i });
    }
  }
  const sunLines = [];
  dayMap.forEach((sun, key) => {
    const parts = key.split('-').map(Number);
    const midnight = new Date(parts[0], parts[1], parts[2]).getTime();
    sunLines.push({ x: xAtMsForHours(midnight + sun.sunriseHr * 3600000, hours) });
    sunLines.push({ x: xAtMsForHours(midnight + sun.sunsetHr * 3600000, hours) });
  });
  const isNight = [];
  for (let i = 0; i < n; i++) {
    const t = new Date(hours[i].time);
    const key = t.getFullYear() + '-' + t.getMonth() + '-' + t.getDate();
    const sun = dayMap.get(key);
    const hr = t.getHours() + t.getMinutes() / 60;
    isNight.push(hr < sun.sunriseHr || hr >= sun.sunsetHr);
  }
  const xStartFor = (i) => i === 0 ? PLOT_LEFT : (xForIdx(i - 1, n) + xForIdx(i, n)) / 2;
  const xEndFor = (i) => i === n - 1 ? PLOT_RIGHT : (xForIdx(i, n) + xForIdx(i + 1, n)) / 2;
  const nightRuns = [];
  let start = null;
  for (let i = 0; i < n; i++) {
    if (isNight[i] && start === null) start = i;
    if ((!isNight[i] || i === n - 1) && start !== null) {
      const end = isNight[i] && i === n - 1 ? i : i - 1;
      nightRuns.push({ x: xStartFor(start), w: xEndFor(end) - xStartFor(start) });
      start = null;
    }
  }
  return { dayDividers, sunMarkers, nightRuns, sunLines };
}

// Per-feature std across LOO fold weight vectors. Drives the ±1σ uncertainty
// band on the forest plot. Returns null when the LOO bundle is missing.
function foldWeightStds(loo) {
  if (!loo || !loo.foldWeights || !loo.foldWeights.length) return null;
  const folds = loo.foldWeights;
  const nF = folds[0].length;
  const stds = [];
  for (let j = 0; j < nF; j++) {
    let sum = 0, sumSq = 0;
    for (let i = 0; i < folds.length; i++) { sum += folds[i][j]; sumSq += folds[i][j] * folds[i][j]; }
    const mean = sum / folds.length;
    const variance = (sumSq / folds.length) - mean * mean;
    stds.push(Math.sqrt(Math.max(0, variance)));
  }
  return stds;
}

// Classify a logged entry's swell direction relative to the reef window.
// Drives the scatter dot color: in (well inside), edge (in window but off
// center), out (outside window — alignment clamped to 0).
function alignmentClass(entry) {
  if (!entry || !entry.conditions || !entry.conditions.swell) return 'out';
  const dir = entry.conditions.swell.direction;
  if (dir == null) return 'out';
  const geo = _windowGeometry();
  const a = _dirAlignment(dir, geo);
  if (a >= 0.5) return 'in';
  if (a > 0)    return 'edge';
  return 'out';
}

const ALIGNMENT_COLORS = {
  in: QUALITY_COLORS.good,    // #57e649
  edge: QUALITY_COLORS.fair,  // #fb923c
  out: QUALITY_COLORS.poor,   // #ff4747
};

// CARD 1 — Predicted Score Timeline
// Three predicted score lines (Wave / Ride / Cond) for the same forecast
// window as SwellChart. Hover state is local so this card doesn't couple to
// the swell chart's hover.
// ════════════════════════════════════════════════

// Build per-segment colored paths so the line color tracks the score quality
// bracket between adjacent hours. Skips segments where either endpoint is null
// (model not trained or feature extraction missed).
function _buildScoreSegments(series, points) {
  const segs = [];
  if (!series || !points || points.length < 2) return segs;
  for (let i = 0; i < series.length - 1; i++) {
    const a = series[i], b = series[i + 1];
    if (a == null || b == null) continue;
    const p1 = points[i], p2 = points[i + 1];
    const p0 = points[i === 0 ? i : i - 1];
    const p3 = points[i + 2] || p2;
    const c1x = p1.x + (p2.x - p0.x) / 6;
    const c1y = p1.y + (p2.y - p0.y) / 6;
    const c2x = p2.x - (p3.x - p1.x) / 6;
    const c2y = p2.y - (p3.y - p1.y) / 6;
    const q = scoreQ((a + b) / 2);
    const d = `M ${p1.x} ${p1.y} C ${c1x.toFixed(2)} ${c1y.toFixed(2)}, ${c2x.toFixed(2)} ${c2y.toFixed(2)}, ${p2.x.toFixed(2)} ${p2.y.toFixed(2)}`;
    segs.push({ d, color: QUALITY_COLORS[q] });
  }
  return segs;
}

function PredHoverBanner({ hours, hoveredIdx, wrapWidth, series, isMobile }) {
  if (hoveredIdx == null || !hours[hoveredIdx] || !wrapWidth) return null;
  const h = hours[hoveredIdx];
  const n = hours.length;
  const wave = series.wave[hoveredIdx];
  const ride = series.ride[hoveredIdx];
  const cond = series.cond[hoveredIdx];

  const innerW = Math.max(0, wrapWidth - (isMobile ? 16 : 24));
  const padX = isMobile ? 8 : 12;
  const pxX = padX + (xForIdx(hoveredIdx, n) / 800) * innerW;
  const W = isMobile ? 150 : 200;
  const leftPx = Math.max(8, Math.min(wrapWidth - W - 8, pxX - W / 2));

  const t = new Date(h.time);
  const dayStr = t.toLocaleDateString('en-US', { weekday: 'short' }).toUpperCase();
  const hr = t.getHours();
  const hourStr = hr === 0 ? '12AM' : hr === 12 ? '12PM' : hr < 12 ? hr + 'AM' : (hr - 12) + 'PM';
  const headerStr = dayStr + ' · ' + hourStr;

  const overall = [wave, ride, cond].filter(v => v != null);
  const avg = overall.length ? overall.reduce((a, b) => a + b, 0) / overall.length : null;
  const accent = QUALITY_COLORS[scoreQ(avg)];

  const style = {
    position: 'absolute',
    left: leftPx + 'px',
    top: isMobile ? '8px' : '14px',
    width: W + 'px',
    background: '#0f1120',
    borderLeft: '2px solid ' + accent,
    clipPath: isMobile
      ? 'polygon(6px 0, calc(100% - 6px) 0, 100% 6px, 100% calc(100% - 6px), calc(100% - 6px) 100%, 6px 100%, 0 calc(100% - 6px), 0 6px)'
      : 'polygon(12px 0, calc(100% - 12px) 0, 100% 12px, 100% calc(100% - 12px), calc(100% - 12px) 100%, 12px 100%, 0 calc(100% - 12px), 0 12px)',
    padding: isMobile ? '6px 8px' : '10px',
    fontFamily: 'Noto Sans, sans-serif',
    color: '#e6e8f2',
    pointerEvents: 'none',
    zIndex: 3,
    boxShadow: '0 8px 22px rgba(0,0,0,0.55)',
  };

  const rowStyle = { display: 'flex', alignItems: 'center', justifyContent: 'space-between', fontSize: isMobile ? '11px' : '12px', marginTop: '2px' };
  const labelStyle = {
    fontFamily: 'Barlow Condensed, sans-serif',
    fontWeight: 700,
    fontSize: isMobile ? '10px' : '11px',
    letterSpacing: '0.14em',
    color: '#6c7091',
    textTransform: 'uppercase',
  };
  const fmt = (v) => v == null ? '–' : v.toFixed(1);

  return (
    <div style={style}>
      <div style={{ ...labelStyle, color: '#cfd3e6' }}>{headerStr}</div>
      <div style={rowStyle}>
        <span style={labelStyle}>Wave</span>
        <span style={{ color: QUALITY_COLORS[scoreQ(wave)], fontFamily: 'DM Mono, monospace', fontWeight: 700 }}>{fmt(wave)}</span>
      </div>
      <div style={rowStyle}>
        <span style={labelStyle}>Ride</span>
        <span style={{ color: QUALITY_COLORS[scoreQ(ride)], fontFamily: 'DM Mono, monospace', fontWeight: 700 }}>{fmt(ride)}</span>
      </div>
      <div style={rowStyle}>
        <span style={labelStyle}>Cond</span>
        <span style={{ color: QUALITY_COLORS[scoreQ(cond)], fontFamily: 'DM Mono, monospace', fontWeight: 700 }}>{fmt(cond)}</span>
      </div>
      <div style={{ marginTop: '6px', fontSize: isMobile ? '10px' : '11px', color: '#8a90a8', fontFamily: 'Barlow Condensed, sans-serif', fontWeight: 700, letterSpacing: '0.04em' }}>
        {h.waveFt != null ? h.waveFt.toFixed(1) : '–'} FT @ {h.period != null ? h.period.toFixed(0) + 's' : '–'}
        {' · '}
        {h.windMph != null ? Math.round(h.windMph) : '–'} mph {degToCompass(h.windDir) || ''}
      </div>
    </div>
  );
}

function PredictedScoreTimeline({ hours, bundle, tideHiLo, modelStatus }) {
  const wrapRef = useRef(null);
  const [wrapWidth, setWrapWidth] = useState(0);
  const [hoveredIdx, setHoveredIdx] = useState(null);

  useEffect(() => {
    const update = () => { if (wrapRef.current) setWrapWidth(wrapRef.current.clientWidth); };
    update();
    window.addEventListener('resize', update);
    return () => window.removeEventListener('resize', update);
  }, []);

  const series = useMemo(
    () => computePredictionSeries(hours || [], bundle, tideHiLo),
    [hours, bundle, tideHiLo]
  );

  const geom = useMemo(() => computeTimelineGeometry(hours || []), [hours]);
  const n = hours ? hours.length : 0;

  const wavePoints = useMemo(() => series.wave.map((s, i) => ({ x: xForIdx(i, n), y: yForScore(s) })), [series, n]);
  const ridePoints = useMemo(() => series.ride.map((s, i) => ({ x: xForIdx(i, n), y: yForScore(s) })), [series, n]);
  const condPoints = useMemo(() => series.cond.map((s, i) => ({ x: xForIdx(i, n), y: yForScore(s) })), [series, n]);

  const waveSegs = useMemo(() => _buildScoreSegments(series.wave, wavePoints), [series, wavePoints]);
  const rideSegs = useMemo(() => _buildScoreSegments(series.ride, ridePoints), [series, ridePoints]);
  const condSegs = useMemo(() => _buildScoreSegments(series.cond, condPoints), [series, condPoints]);

  const idxFromClientX = (clientX, rect) => {
    if (!n) return null;
    const vbX = ((clientX - rect.left) / rect.width) * 800;
    if (vbX < PLOT_LEFT || vbX > PLOT_RIGHT) return null;
    const frac = (vbX - PLOT_LEFT) / PLOT_WIDTH;
    return Math.max(0, Math.min(n - 1, Math.round(frac * (n - 1))));
  };

  const handleMove = (e) => {
    const rect = e.currentTarget.getBoundingClientRect();
    const i = idxFromClientX(e.clientX, rect);
    setHoveredIdx(i);
  };
  const handleTouch = (e) => {
    const touch = e.touches[0];
    if (!touch) return;
    const rect = e.currentTarget.getBoundingClientRect();
    const i = idxFromClientX(touch.clientX, rect);
    if (i != null) setHoveredIdx(i);
  };

  const yTicks = [1, 3, 5, 7, 9, 10];
  const haveAny = (bundle && (bundle.wave.weights || bundle.ride.weights || bundle.cond.weights));

  // Empty-state overlay: not signed in / under-trained / forecast still loading.
  let overlay = null;
  if (modelStatus === 'noAuth') {
    overlay = 'Sign in to see your personalized predicted scores.';
  } else if (modelStatus === 'loading' || modelStatus === 'error') {
    overlay = modelStatus === 'error' ? 'Surf-log model unavailable.' : 'Training your surf-log model…';
  } else if (modelStatus === 'ready' && bundle && !haveAny) {
    const ns = [bundle.wave.n || 0, bundle.ride.n || 0, bundle.cond.n || 0];
    const mins = [bundle.wave.minSamples || 12, bundle.ride.minSamples || 12, bundle.cond.minSamples || 12];
    const need = Math.max(0, mins[0] - ns[0], mins[1] - ns[1], mins[2] - ns[2]);
    overlay = need > 0
      ? 'Log ' + need + ' more session' + (need === 1 ? '' : 's') + ' to unlock predicted scores.'
      : 'Not enough usable sessions to train yet.';
  }

  const hovered = hoveredIdx != null && n > 0
    ? { x: xForIdx(hoveredIdx, n) }
    : null;

  return (
    <div className="fn-card">
      <SectionHeader
        title="Predicted Score Timeline"
        pill="Model"
        sub="Wave / Ride / Conditions scores from your trained surf-log models, scored hourly across the forecast window."
      />
      <div className="fn-chart-wrap" ref={wrapRef} style={{ position: 'relative', touchAction: IS_MOBILE ? 'none' : undefined }}>
        <svg viewBox="0 0 800 270" preserveAspectRatio="xMidYMid meet"
             onMouseMove={handleMove}
             onMouseLeave={() => { if (!IS_MOBILE) setHoveredIdx(null); }}
             onTouchStart={handleTouch}
             onTouchMove={handleTouch}
             onTouchEnd={() => setHoveredIdx(null)}
             onTouchCancel={() => setHoveredIdx(null)}>
          <rect x={PLOT_LEFT} y={PLOT_TOP} width={PLOT_WIDTH} height={PLOT_HEIGHT} fill="#0a0c18" />

          {yTicks.map(s => (
            <g key={'pyt-' + s}>
              <line x1={PLOT_LEFT} x2={PLOT_RIGHT} y1={yForScore(s)} y2={yForScore(s)} stroke="#1a1d33" strokeWidth="1" />
              <text x={PLOT_LEFT - 6} y={yForScore(s) + 4} fontFamily="Noto Sans, sans-serif" fontSize="10" fill="#8a90a8" textAnchor="end">{s}</text>
            </g>
          ))}

          {geom.nightRuns.map((run, i) => (
            <rect key={'pn-' + i} x={run.x} y={PLOT_TOP} width={run.w} height={PLOT_HEIGHT} fill="rgba(2,3,14,0.58)" />
          ))}

          {geom.sunMarkers.map((m, i) => (
            <g key={'psm-' + i} transform={`translate(${m.x.toFixed(2)}, ${(PLOT_TOP + 32)})`}>
              <circle r="4.5" fill="#fde047" stroke="#facc15" strokeWidth="0.5" />
              <g stroke="#fde047" strokeWidth="1.3" strokeLinecap="round">
                <line x1="0" y1="-7" x2="0" y2="-9.5" />
                <line x1="0" y1="7" x2="0" y2="9.5" />
                <line x1="-7" y1="0" x2="-9.5" y2="0" />
                <line x1="7" y1="0" x2="9.5" y2="0" />
                <line x1="-5" y1="-5" x2="-6.9" y2="-6.9" />
                <line x1="5" y1="-5" x2="6.9" y2="-6.9" />
                <line x1="-5" y1="5" x2="-6.9" y2="6.9" />
                <line x1="5" y1="5" x2="6.9" y2="6.9" />
              </g>
            </g>
          ))}

          {geom.sunLines.map((sl, i) => (
            <line key={'psl-' + i} x1={sl.x} x2={sl.x} y1={PLOT_TOP} y2={PLOT_BOTTOM}
                  stroke="#f5c518" strokeOpacity="0.22" strokeWidth="1" strokeDasharray="3 3" />
          ))}

          {geom.dayDividers.map((dv, i) => (
            <g key={'pdv-' + i}>
              <line x1={dv.x} x2={dv.x} y1={PLOT_TOP} y2={PLOT_BOTTOM}
                    stroke="#f5c518" strokeOpacity="0.18" strokeWidth="1" strokeDasharray="3 3" />
              <text x={dv.labelX} y={PLOT_TOP + 12} fontFamily="Noto Sans, sans-serif" fontSize="11" fontWeight="600" fill="#cfd3e6" textAnchor="middle">
                {dv.label}
              </text>
            </g>
          ))}

          {/* Lines: wave (thickest) on bottom, then ride, then cond on top so the
              thinner conditions line stays readable when overlapping. */}
          {bundle && bundle.wave.weights && waveSegs.map((seg, i) => (
            <path key={'wv-' + i} d={seg.d} fill="none" stroke={seg.color} strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" />
          ))}
          {bundle && bundle.ride.weights && rideSegs.map((seg, i) => (
            <path key={'rd-' + i} d={seg.d} fill="none" stroke={seg.color} strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" />
          ))}
          {bundle && bundle.cond.weights && condSegs.map((seg, i) => (
            <path key={'cd-' + i} d={seg.d} fill="none" stroke={seg.color} strokeWidth="1.5" strokeLinejoin="round" strokeLinecap="round" />
          ))}

          {hovered && (
            <line x1={hovered.x} x2={hovered.x} y1={PLOT_TOP} y2={PLOT_BOTTOM} stroke="#f5c518" strokeOpacity="0.55" strokeWidth="1" pointerEvents="none" />
          )}
        </svg>

        {overlay && (
          <div className="fn-pred-overlay-msg">
            <div className="fn-rose-overlay-inner">{overlay}</div>
          </div>
        )}

        {!overlay && (
          <PredHoverBanner hours={hours || []} hoveredIdx={hoveredIdx} wrapWidth={wrapWidth} series={series} isMobile={IS_MOBILE} />
        )}
      </div>

      <div className="fn-legend">
        <span className="fn-legend-item">
          <span style={{ width: '18px', height: '2.5px', background: '#cfd3e6', display: 'inline-block' }}></span>
          Wave
        </span>
        <span className="fn-legend-item">
          <span style={{ width: '18px', height: '2px', background: '#cfd3e6', display: 'inline-block' }}></span>
          Ride
        </span>
        <span className="fn-legend-item">
          <span style={{ width: '18px', height: '1.5px', background: '#cfd3e6', display: 'inline-block' }}></span>
          Conditions
        </span>
        <span className="fn-legend-item">
          <span className="fn-legend-dot" style={{ background: QUALITY_COLORS.good }}></span>
          ≥ 7
        </span>
        <span className="fn-legend-item">
          <span className="fn-legend-dot" style={{ background: QUALITY_COLORS.fair }}></span>
          5 – 7
        </span>
        <span className="fn-legend-item">
          <span className="fn-legend-dot" style={{ background: QUALITY_COLORS.poor }}></span>
          &lt; 5
        </span>
      </div>

      <div className="fn-statusbar">
        <span><span className="fn-status-key">When</span><span className="fn-status-val">{hoveredIdx != null && hours && hours[hoveredIdx] ? new Date(hours[hoveredIdx].time).toLocaleString('en-US', { weekday: 'short', month: 'short', day: '2-digit', hour: 'numeric' }) : 'Hover the chart for hourly scores'}</span></span>
      </div>

      <Sources links={PREDICTION_SOURCES} />
    </div>
  );
}

// ════════════════════════════════════════════════
// CARD 2 — Feature Weights Forest Plot
// Tab pills (Wave / Ride / Conditions) select which model's weights to show.
// Each row is one feature; horizontal bar = signed weight (z-scored), with a
// semi-transparent ±1σ band derived from LOO fold weights. A "?" suffix on
// the % label flags features whose band crosses zero (sign-uncertain).
// ════════════════════════════════════════════════

const TAB_DEFS = [
  { key: 'wave', label: 'Wave',       target: 'size'        },
  { key: 'ride', label: 'Ride',       target: 'rideQuality' },
  { key: 'cond', label: 'Conditions', target: 'windQuality' },
];

function _activeModel(bundle, key) {
  if (!bundle) return null;
  return bundle[key] || null;
}

// Color the RMSE chip: green <=1.5, orange <=2.0, red above. RMSE is in the
// same 1-10 units as the rating target.
function _rmseChipColor(rmse) {
  if (rmse == null) return '#6c7091';
  if (rmse > 2.0) return QUALITY_COLORS.poor;
  if (rmse > 1.5) return QUALITY_COLORS.fair;
  return QUALITY_COLORS.good;
}

// Color the R² chip: green >=0.5, orange >=0.3, red below.
function _r2ChipColor(r2) {
  if (r2 == null) return '#6c7091';
  if (r2 >= 0.5) return QUALITY_COLORS.good;
  if (r2 >= 0.3) return QUALITY_COLORS.fair;
  return QUALITY_COLORS.poor;
}

function TabPills({ tabs, active, onSelect }) {
  return (
    <div className="fn-tab-pills" role="tablist">
      {tabs.map(t => (
        <button
          key={t.key}
          role="tab"
          aria-selected={active === t.key}
          className={'fn-tab-pill' + (active === t.key ? ' active' : '')}
          onClick={() => onSelect(t.key)}>
          {t.label}
        </button>
      ))}
    </div>
  );
}

function FeatureWeightsForestPlot({ bundle, modelStatus }) {
  const [active, setActive] = useState('wave');
  const model = _activeModel(bundle, active);
  const tabDef = TAB_DEFS.find(t => t.key === active);

  let body;
  if (modelStatus === 'noAuth') {
    body = <div className="fn-placeholder">Sign in to see your trained feature weights.</div>;
  } else if (modelStatus === 'loading') {
    body = <div className="fn-placeholder">Training your surf-log model…</div>;
  } else if (modelStatus === 'error') {
    body = <div className="fn-placeholder">Surf-log model unavailable.</div>;
  } else if (!model || !model.weights) {
    const need = model ? Math.max(0, (model.minSamples || 12) - (model.n || 0)) : 0;
    body = (
      <div className="fn-placeholder">
        {need > 0
          ? 'Log ' + need + ' more session' + (need === 1 ? '' : 's') + ' to unlock the ' + tabDef.label + ' model.'
          : 'Not enough usable sessions to train the ' + tabDef.label + ' model.'}
      </div>
    );
  } else {
    const names = model.featureNames || [];
    const weights = model.weights || [];
    const stds = foldWeightStds(model.loo) || weights.map(() => 0);
    // Bar scale: pick the largest |weight + std| so even the band ends fit.
    const maxAbs = Math.max(0.01, ...weights.map((w, i) => Math.abs(w) + (stds[i] || 0)));
    const ROW_H = 26;
    const LABEL_W = 200;
    const BAR_AREA_X = LABEL_W;
    const BAR_AREA_W = 360;
    const PCT_X = LABEL_W + BAR_AREA_W + 16;
    const W_PX = PCT_X + 60;
    const H_PX = names.length * ROW_H + 12;
    const center = BAR_AREA_X + BAR_AREA_W / 2;
    const scale = (BAR_AREA_W / 2 - 6) / maxAbs;

    body = (
      <div className="fn-chart-wrap" style={{ overflowX: 'auto' }}>
        <svg viewBox={`0 0 ${W_PX} ${H_PX}`} preserveAspectRatio="xMidYMid meet" style={{ minWidth: '420px' }}>
          {/* Zero axis */}
          <line x1={center} x2={center} y1={6} y2={H_PX - 6} stroke="#3a3f5a" strokeWidth="1" />
          {names.map((nm, i) => {
            const w = weights[i] || 0;
            const std = stds[i] || 0;
            const lo = w - std, hi = w + std;
            const crossesZero = lo < 0 && hi > 0;
            const barX = w >= 0 ? center : center + w * scale;
            const barW = Math.abs(w * scale);
            const bandX = center + lo * scale;
            const bandW = Math.max(2, (hi - lo) * scale);
            const fill = crossesZero ? '#6c7091' : (w >= 0 ? QUALITY_COLORS.good : QUALITY_COLORS.poor);
            const pct = Math.round(w * 10);
            const pctStr = (pct >= 0 ? '+' : '') + pct + '%' + (crossesZero ? ' ?' : '');
            const y = 6 + i * ROW_H + ROW_H / 2;
            return (
              <g key={'fw-' + nm + '-' + i}>
                <text x={LABEL_W - 12} y={y + 4} fontFamily="Noto Sans, sans-serif" fontSize="12" fill="#cfd3e6" textAnchor="end">
                  {prettyFeature(nm)}
                </text>
                {/* Uncertainty band */}
                <rect x={bandX} y={y - 8} width={bandW} height={16} fill={fill} fillOpacity="0.18" />
                {/* Signed bar */}
                <rect x={barX} y={y - 4} width={Math.max(1, barW)} height={8} fill={fill} />
                <text x={PCT_X} y={y + 4} fontFamily="DM Mono, monospace" fontSize="12" fill={fill} textAnchor="start">
                  {pctStr}
                </text>
              </g>
            );
          })}
        </svg>
      </div>
    );
  }

  // Status bar — always shown so the user can see N + RMSE for whichever tab
  // they're on, even when an empty-state placeholder occupies the body.
  const rmse = model && model.loo ? model.loo.rmse : null;
  const rmseColor = _rmseChipColor(rmse);

  return (
    <div className="fn-card">
      <SectionHeader
        title="Feature Weights"
        pill="Model Diagnostics"
        sub="Δ predicted rating per 1σ change in feature, as % of the 10-pt scale. Bands span ±1σ of fold weights from leave-one-out cross-validation; “?” flags features whose band crosses zero."
      />
      <TabPills tabs={TAB_DEFS} active={active} onSelect={setActive} />
      {body}
      <div className="fn-statusbar">
        <span><span className="fn-status-key">Target</span><span className="fn-status-val">{tabDef.target}</span></span>
        <span><span className="fn-status-key">N</span><span className="fn-status-val">{model && model.n != null ? model.n : '–'}</span></span>
        <span>
          <span className="fn-status-key">RMSE (LOO)</span>
          <span className="fn-status-val" style={{ color: rmseColor }}>
            {rmse != null ? rmse.toFixed(2) : '–'}
          </span>
        </span>
      </div>
      <Sources links={MODEL_DIAG_SOURCES} />
    </div>
  );
}

// ════════════════════════════════════════════════
// CARD 3 — Predicted vs Actual Scatter
// One dot per logged session (using LOO out-of-sample predictions). Diagonal
// reference line marks perfect calibration. Dot color encodes how well the
// session's swell direction sat in the reef window. Click/tap a dot for a
// tooltip; if the session has photos, the photo modal opens too.
// ════════════════════════════════════════════════

// Pearson R² between LOO predictions and actuals. Returns null when there
// isn't enough data or actuals have zero variance (would divide by zero).
function _computeR2(preds, actuals) {
  if (!preds || !actuals || preds.length < 2 || preds.length !== actuals.length) return null;
  const mean = actuals.reduce((a, b) => a + b, 0) / actuals.length;
  let ssTot = 0, ssRes = 0;
  for (let i = 0; i < actuals.length; i++) {
    ssTot += (actuals[i] - mean) * (actuals[i] - mean);
    ssRes += (actuals[i] - preds[i]) * (actuals[i] - preds[i]);
  }
  if (ssTot < 1e-10) return null;
  return 1 - ssRes / ssTot;
}

function _formatLogDate(entry) {
  if (!entry) return '–';
  const ts = entry.timestamp;
  let d;
  if (!ts) return '–';
  if (typeof ts === 'string') d = new Date(ts);
  else if (ts.toDate) d = ts.toDate();          // Firestore Timestamp
  else if (ts.seconds != null) d = new Date(ts.seconds * 1000);
  else if (ts instanceof Date) d = ts;
  else return '–';
  if (isNaN(d.getTime())) return '–';
  return d.toLocaleDateString('en-US', { month: 'short', day: '2-digit', year: 'numeric' });
}

function _photoUrl(p) {
  if (!p) return null;
  if (typeof p === 'string') return p;
  return p.url || p.src || null;
}

function ScatterTooltip({ entry, pred, actual, x, y, plotW, plotH }) {
  if (!entry) return null;
  const W = 200;
  const left = Math.max(8, Math.min(plotW - W - 8, x - W / 2));
  const top = Math.max(8, y - 110);
  const cond = entry.conditions || {};
  const swell = cond.swell || {};
  const wind = cond.wind || {};
  return (
    <div style={{
      position: 'absolute',
      left: left + 'px',
      top: top + 'px',
      width: W + 'px',
      background: '#0f1120',
      borderLeft: '2px solid ' + ALIGNMENT_COLORS[alignmentClass(entry)],
      clipPath: 'polygon(8px 0, calc(100% - 8px) 0, 100% 8px, 100% calc(100% - 8px), calc(100% - 8px) 100%, 8px 100%, 0 calc(100% - 8px), 0 8px)',
      padding: '8px 10px',
      fontFamily: 'Noto Sans, sans-serif',
      color: '#e6e8f2',
      pointerEvents: 'none',
      zIndex: 4,
      boxShadow: '0 8px 22px rgba(0,0,0,0.55)',
    }}>
      <div style={{ fontFamily: 'Barlow Condensed, sans-serif', fontWeight: 700, fontSize: '11px', letterSpacing: '0.14em', color: '#cfd3e6', textTransform: 'uppercase' }}>
        {_formatLogDate(entry)}
      </div>
      <div style={{ marginTop: '4px', display: 'flex', gap: '10px', fontSize: '12px' }}>
        <span><span style={{ color: '#6c7091' }}>Pred</span> <span style={{ fontFamily: 'DM Mono, monospace', fontWeight: 700 }}>{pred != null ? pred.toFixed(1) : '–'}</span></span>
        <span><span style={{ color: '#6c7091' }}>Actual</span> <span style={{ fontFamily: 'DM Mono, monospace', fontWeight: 700 }}>{actual != null ? actual.toFixed(1) : '–'}</span></span>
      </div>
      <div style={{ marginTop: '4px', fontSize: '11px', color: '#a9b0c7' }}>
        {swell.height != null ? swell.height.toFixed(1) + ' ft' : '–'}
        {swell.period != null ? ' @ ' + Math.round(swell.period) + 's' : ''}
        {swell.direction != null ? ' ' + degToCompass(swell.direction) : ''}
      </div>
      <div style={{ marginTop: '2px', fontSize: '11px', color: '#a9b0c7' }}>
        {wind.speed != null ? Math.round(wind.speed) + ' mph' : '–'}
        {wind.direction != null ? ' ' + degToCompass(wind.direction) : ''}
      </div>
    </div>
  );
}

function PhotoModal({ photo, onClose }) {
  // Close on Escape regardless of focus.
  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [onClose]);
  const url = _photoUrl(photo);
  if (!url) return null;
  return (
    <div className="fn-photo-modal" onClick={onClose} role="dialog" aria-modal="true">
      <button className="fn-photo-modal-close" onClick={(e) => { e.stopPropagation(); onClose(); }}>
        Close
      </button>
      <img src={url} alt="Surf log photo" onClick={(e) => e.stopPropagation()} />
    </div>
  );
}

function PredVsActualScatter({ bundle, modelStatus }) {
  const [active, setActive] = useState('wave');
  const [selected, setSelected] = useState(null); // index into LOO arrays
  const [modalPhoto, setModalPhoto] = useState(null);
  const wrapRef = useRef(null);
  const [wrapWidth, setWrapWidth] = useState(0);

  useEffect(() => {
    const update = () => { if (wrapRef.current) setWrapWidth(wrapRef.current.clientWidth); };
    update();
    window.addEventListener('resize', update);
    return () => window.removeEventListener('resize', update);
  }, []);

  // Drop the parked selection when the active tab changes — selection is per
  // tab and indexes into that tab's LOO arrays.
  useEffect(() => { setSelected(null); }, [active]);

  const model = _activeModel(bundle, active);
  const tabDef = TAB_DEFS.find(t => t.key === active);
  const loo = model && model.loo;

  let body;
  if (modelStatus === 'noAuth') {
    body = <div className="fn-placeholder">Sign in to see your model calibration.</div>;
  } else if (modelStatus === 'loading') {
    body = <div className="fn-placeholder">Training your surf-log model…</div>;
  } else if (modelStatus === 'error') {
    body = <div className="fn-placeholder">Surf-log model unavailable.</div>;
  } else if (!loo || !loo.foldPreds || !loo.foldPreds.length) {
    const need = model ? Math.max(0, (model.minSamples || 12) + 1 - (model.n || 0)) : 0;
    body = (
      <div className="fn-placeholder">
        {need > 0
          ? 'Log ' + need + ' more session' + (need === 1 ? '' : 's') + ' to unlock the ' + tabDef.label + ' calibration scatter.'
          : 'Not enough usable sessions for ' + tabDef.label + ' calibration.'}
      </div>
    );
  } else {
    const VB_W = 600, VB_H = 320;
    const PAD_L = 44, PAD_R = 18, PAD_T = 14, PAD_B = 36;
    const innerW = VB_W - PAD_L - PAD_R;
    const innerH = VB_H - PAD_T - PAD_B;
    const yMin = 1, yMax = 10;
    const xMin = 1, xMax = 10;
    const scaleX = (v) => PAD_L + ((v - xMin) / (xMax - xMin)) * innerW;
    const scaleY = (v) => PAD_T + (1 - (v - yMin) / (yMax - yMin)) * innerH;

    const preds = loo.foldPreds, actuals = loo.actuals, indices = loo.indices || [];
    const r2 = _computeR2(preds, actuals);

    const dots = preds.map((p, i) => {
      const a = actuals[i];
      const entry = bundle.entries[indices[i]];
      const cls = alignmentClass(entry);
      // Clamp to plot range for placement, but keep raw values for tooltip.
      const px = scaleX(Math.max(xMin, Math.min(xMax, p)));
      const py = scaleY(Math.max(yMin, Math.min(yMax, a)));
      return { i, px, py, p, a, entry, color: ALIGNMENT_COLORS[cls], cls };
    });

    const ticks = [1, 3, 5, 7, 9, 10];

    const onSelectDot = (i) => {
      setSelected(i === selected ? null : i);
      const entry = bundle.entries[indices[i]];
      const photo = entry && entry.photos && entry.photos[0];
      if (photo && _photoUrl(photo)) setModalPhoto(photo);
    };

    body = (
      <div className="fn-chart-wrap" ref={wrapRef} style={{ position: 'relative' }}>
        <svg viewBox={`0 0 ${VB_W} ${VB_H}`} preserveAspectRatio="xMidYMid meet">
          <rect x={PAD_L} y={PAD_T} width={innerW} height={innerH} fill="#0a0c18" />
          {ticks.map(t => (
            <g key={'gx-' + t}>
              <line x1={scaleX(t)} x2={scaleX(t)} y1={PAD_T} y2={PAD_T + innerH} stroke="#1a1d33" strokeWidth="1" />
              <text x={scaleX(t)} y={PAD_T + innerH + 14} fontFamily="Noto Sans, sans-serif" fontSize="10" fill="#8a90a8" textAnchor="middle">{t}</text>
            </g>
          ))}
          {ticks.map(t => (
            <g key={'gy-' + t}>
              <line x1={PAD_L} x2={PAD_L + innerW} y1={scaleY(t)} y2={scaleY(t)} stroke="#1a1d33" strokeWidth="1" />
              <text x={PAD_L - 6} y={scaleY(t) + 4} fontFamily="Noto Sans, sans-serif" fontSize="10" fill="#8a90a8" textAnchor="end">{t}</text>
            </g>
          ))}
          {/* Diagonal reference line */}
          <line x1={scaleX(xMin)} y1={scaleY(yMin)} x2={scaleX(xMax)} y2={scaleY(yMax)}
                stroke="#f5c518" strokeOpacity="0.22" strokeWidth="1" strokeDasharray="3 3" />
          {/* Axis labels */}
          <text x={PAD_L + innerW / 2} y={VB_H - 8} fontFamily="Noto Sans, sans-serif" fontSize="11" fill="#8a90a8" textAnchor="middle">Predicted (LOO)</text>
          <text x={14} y={PAD_T + innerH / 2} fontFamily="Noto Sans, sans-serif" fontSize="11" fill="#8a90a8" textAnchor="middle" transform={`rotate(-90, 14, ${PAD_T + innerH / 2})`}>Actual rating</text>
          {/* Dots */}
          {dots.map(d => (
            <circle key={'sd-' + d.i} cx={d.px} cy={d.py} r={selected === d.i ? 6 : 4}
                    fill={d.color} stroke="#0a0c18" strokeWidth="1"
                    style={{ cursor: 'pointer' }}
                    onClick={() => onSelectDot(d.i)} />
          ))}
        </svg>
        {selected != null && dots[selected] && (
          <ScatterTooltipShim dot={dots[selected]} wrapWidth={wrapWidth} vbW={VB_W} vbH={VB_H} />
        )}
      </div>
    );
  }

  // Status bar always shown — N + RMSE + R² regardless of body state.
  const rmse = loo ? loo.rmse : null;
  const r2 = loo ? _computeR2(loo.foldPreds, loo.actuals) : null;

  return (
    <div className="fn-card">
      <SectionHeader
        title="Calibration"
        pill="Predicted vs Actual"
        sub="Each dot is one logged session, plotted with its leave-one-out predicted score against your actual rating. Closer to the diagonal = better calibration. Dot color encodes how well the session's swell direction sat in the reef window."
      />
      <TabPills tabs={TAB_DEFS} active={active} onSelect={setActive} />
      {body}
      <div className="fn-legend">
        <span className="fn-legend-item">
          <span className="fn-legend-dot" style={{ background: ALIGNMENT_COLORS.in }}></span>
          In window
        </span>
        <span className="fn-legend-item">
          <span className="fn-legend-dot" style={{ background: ALIGNMENT_COLORS.edge }}></span>
          Edge of window
        </span>
        <span className="fn-legend-item">
          <span className="fn-legend-dot" style={{ background: ALIGNMENT_COLORS.out }}></span>
          Outside window
        </span>
      </div>
      <div className="fn-statusbar">
        <span><span className="fn-status-key">Target</span><span className="fn-status-val">{tabDef.target}</span></span>
        <span><span className="fn-status-key">N</span><span className="fn-status-val">{loo && loo.n != null ? loo.n : '–'}</span></span>
        <span>
          <span className="fn-status-key">RMSE</span>
          <span className="fn-status-val" style={{ color: _rmseChipColor(rmse) }}>{rmse != null ? rmse.toFixed(2) : '–'}</span>
        </span>
        <span>
          <span className="fn-status-key">R²</span>
          <span className="fn-status-val" style={{ color: _r2ChipColor(r2) }}>{r2 != null ? r2.toFixed(2) : '–'}</span>
        </span>
      </div>
      <Sources links={MODEL_DIAG_SOURCES} />
      {modalPhoto && <PhotoModal photo={modalPhoto} onClose={() => setModalPhoto(null)} />}
    </div>
  );
}

// SVG-coord → pixel-coord wrapper for the scatter tooltip. Resolves the
// hovered dot's position within the rendered chart wrap so the absolutely
// positioned tooltip lines up across viewport widths.
function ScatterTooltipShim({ dot, wrapWidth, vbW, vbH }) {
  if (!dot || !wrapWidth) return null;
  const innerW = Math.max(0, wrapWidth - 24);
  const scale = innerW / vbW;
  const px = 12 + dot.px * scale;
  const py = 12 + dot.py * scale;
  return (
    <ScatterTooltip entry={dot.entry} pred={dot.p} actual={dot.a}
                     x={px} y={py} plotW={wrapWidth} plotH={vbH * scale + 24} />
  );
}

// modelStatus drives the empty-state overlays on the three new cards:
//   'loading' → auth/logs/tide still in flight
//   'noAuth'  → user is anonymous or sign-in didn't complete
//   'ready'   → bundle is populated; per-card under-trained checks happen in
//               the cards themselves (each model has its own minSamples gate)
//   'error'   → load/train threw — cards render an error message
function App() {
  const [hours, setHours] = useState(null);
  const [error, setError] = useState(null);
  const [hoveredIdx, setHoveredIdx] = useState(null);

  // Surf-log model state. Decoupled from the forecast fetch so a Firestore /
  // CO-OPS hiccup can't keep the forecast chart from rendering.
  const [modelStatus, setModelStatus] = useState('loading');
  const [bundle, setBundle] = useState(null);
  const [tideHiLo, setTideHiLo] = useState(null);

  useEffect(() => {
    let alive = true;
    fetchForecastData()
      .then(data => { if (alive) setHours(data); })
      .catch(err => { if (alive) setError(err.message || String(err)); });
    return () => { alive = false; };
  }, []);

  useEffect(() => {
    let alive = true;
    (async () => {
      try {
        // window._fnAuthReady resolves once onAuthStateChanged fires for the
        // first time (or after a 1.5s grace for restored sessions). See the
        // standalone Firebase init at the top of the body.
        const user = await (window._fnAuthReady || Promise.resolve(null));
        if (!alive) return;
        if (!user || user.isAnonymous) {
          setModelStatus('noAuth');
          return;
        }
        const [logs, tide] = await Promise.all([
          loadLogsFromFirebase().catch(err => { console.warn('loadLogsFromFirebase failed', err); return []; }),
          fetchTideHiLo(7).catch(err => { console.warn('fetchTideHiLo failed', err); return []; })
        ]);
        if (!alive) return;
        setTideHiLo(tide);
        const b = retrainAll(logs, window._fbUserId);
        setBundle(b);
        logTrainSummary(b);
        setModelStatus('ready');
      } catch (err) {
        if (!alive) return;
        console.warn('[swell-forecast] surf-log model init failed', err);
        setModelStatus('error');
      }
    })();
    return () => { alive = false; };
  }, []);

  // Expose a refresh hook so a future "log a session from this page" button
  // can re-pull Firestore + retrain without restructuring App. Returns the
  // freshly trained bundle for callers that want to chain off it.
  useEffect(() => {
    window._fnRetrainSurfModel = async () => {
      const logs = await loadLogsFromFirebase();
      const tide = tideHiLo || await fetchTideHiLo(7).catch(() => []);
      const b = retrainAll(logs, window._fbUserId);
      setTideHiLo(tide);
      setBundle(b);
      logTrainSummary(b);
      return b;
    };
    return () => { delete window._fnRetrainSurfModel; };
  }, [tideHiLo]);


  if (error) return <ErrorCard message={error} />;
  if (!hours) return <LoadingCard />;

  return (
    <>
      <CardShell>
        <SwellChart hours={hours} hoveredIdx={hoveredIdx} onHover={setHoveredIdx} />
        <Legend />
        <StatusBar hours={hours} hoveredIdx={hoveredIdx} />
        <Sources />
      </CardShell>
      <LineupOverlay hours={hours} hoveredIdx={hoveredIdx} />
      <PredictedScoreTimeline
        hours={hours}
        bundle={bundle}
        tideHiLo={tideHiLo}
        modelStatus={modelStatus} />
      <FeatureWeightsForestPlot
        bundle={bundle}
        modelStatus={modelStatus} />
      <PredVsActualScatter
        bundle={bundle}
        modelStatus={modelStatus} />
      <LiveSpectralPanel />
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
